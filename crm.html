<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>1924 CRM</title>
<style>
:root{
  --face:#d4d0c8; --hi:#ffffff; --lite:#e9e6e0; --shadow:#808080; --dark:#404040;
  --title:#0a246a; --title2:#a6caf0; --desk:#3a6ea5; --sel:#0a246a;
  --red:#a00000; --green:#006400;
  --raised: inset -1px -1px var(--dark), inset 1px 1px var(--lite), inset -2px -2px var(--shadow), inset 2px 2px var(--hi);
  --button: inset -1px -1px var(--dark), inset 1px 1px var(--hi), inset -2px -2px var(--shadow), inset 2px 2px var(--lite);
  --pressed: inset -1px -1px var(--hi), inset 1px 1px var(--dark), inset -2px -2px var(--lite), inset 2px 2px var(--shadow);
  --sunken: inset -1px -1px var(--hi), inset 1px 1px var(--shadow), inset -2px -2px var(--lite), inset 2px 2px var(--dark);
  --thin: inset -1px -1px var(--hi), inset 1px 1px var(--shadow);
  --side:92px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:#000;font-family:"Segoe UI",Tahoma,"Microsoft Sans Serif",Verdana,Arial,sans-serif;font-size:14px;line-height:1.35;overflow:hidden}
button,input,select,textarea{font:inherit;color:#000}
[hidden]{display:none !important}
a{color:#0000ee}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* umumiy boshqaruv elementlari */
.btn{background:var(--face);border:none;padding:7px 14px;box-shadow:var(--button);cursor:pointer;white-space:nowrap}
.btn:active{box-shadow:var(--pressed)}
.btn:focus-visible,.nav button:focus-visible,.card:focus-visible,.chip:focus-visible{outline:1px dotted #000;outline-offset:-5px}
.btn:disabled{color:var(--shadow);text-shadow:1px 1px var(--hi);cursor:default}
.btn.main{font-weight:bold}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.del{color:var(--red)}
.field{background:#fff;border:none;padding:7px 8px;box-shadow:var(--sunken);width:100%;min-width:0}
.field:focus{outline:1px dotted #000;outline-offset:-4px}
select.field{padding:5px 6px}
textarea.field{resize:vertical;min-height:60px}
label{display:block;margin:0 0 3px}
.muted{color:#404040}
.err{color:var(--red);min-height:18px;margin:6px 0 0}
.ok{color:var(--green)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grp{border:1px solid var(--shadow);box-shadow:inset 1px 1px var(--hi),1px 1px var(--hi);margin:0 0 12px;padding:12px 10px 10px}
.grp legend{padding:0 4px}
.title{background:linear-gradient(90deg,var(--title),var(--title2));color:#fff;font-weight:bold;padding:4px 4px 4px 8px;display:flex;align-items:center;gap:8px;min-height:28px;user-select:none}
.title .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{width:24px;height:22px;padding:0;border:none;background:var(--face);box-shadow:var(--button);font:bold 14px/1 Tahoma,Arial,sans-serif;cursor:pointer;color:#000}
.tbtn:active{box-shadow:var(--pressed)}
.win{background:var(--face);box-shadow:var(--raised);padding:3px}

/* kirish */
#login{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow:auto}
#login .win{width:min(420px,100%)}
#login .wbody{padding:16px}
#login .field{margin-bottom:10px}

/* ilova tuzilmasi — amoCRM kabi */
#app{display:grid;grid-template-columns:var(--side) 1fr;height:100vh;height:100dvh}
.nav{background:linear-gradient(180deg,var(--title) 0%,#12357f 100%);display:flex;flex-direction:column;gap:4px;padding:8px 6px;overflow-y:auto}
.nav .logo{color:#fff;font:bold 20px/1 Tahoma,Arial,sans-serif;text-align:center;padding:8px 0 12px;letter-spacing:1px}
.nav button{background:transparent;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;cursor:pointer;font-size:12px;line-height:1.1;position:relative}
.nav button svg{width:24px;height:24px}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button[aria-current="page"]{background:var(--face);color:#000;box-shadow:var(--pressed)}
.nav .badge{position:absolute;top:4px;right:10px;background:#c00000;color:#fff;font-size:11px;font-weight:bold;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.nav .sp{flex:1}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{background:var(--face);box-shadow:var(--raised);padding:8px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top h1{font-size:17px;margin:0 6px 0 2px;white-space:nowrap}
.top .search{flex:1 1 220px;max-width:420px}
.top .sum{white-space:nowrap}
.content{flex:1;min-height:0;overflow:auto}

/* voronka doskasi */
.board{display:flex;gap:10px;padding:12px;height:100%;align-items:stretch;min-width:max-content}
.col{width:272px;flex:none;display:flex;flex-direction:column;background:var(--face);box-shadow:var(--raised);padding:3px;max-height:100%}
.colh{padding:7px 8px 6px;background:var(--face)}
.colh .n{font-weight:bold;text-transform:uppercase;font-size:12.5px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colh .m{font-size:12.5px;color:#303030;margin-top:2px}
.strip{height:4px;margin:0 3px 6px}
.qadd{margin:0 6px 6px}
.qadd .btn{width:100%}
.qform{margin:0 6px 6px;background:#fff;box-shadow:var(--sunken);padding:8px;display:grid;gap:6px}
.colb{flex:1;overflow-y:auto;padding:4px 6px 8px;display:flex;flex-direction:column;gap:6px;min-height:80px;background:#efede8;box-shadow:var(--thin)}
.colb.over{outline:2px dotted #000;outline-offset:-4px;background:#e2e8f4}
.card{background:#fff;box-shadow:var(--button);padding:8px 9px 8px 12px;cursor:pointer;border-left:5px solid var(--title2);position:relative}
.card.dragging{opacity:.45}
.card .t1{display:flex;gap:8px;align-items:baseline}
.card .nm{font-weight:bold;flex:1;min-width:0;overflow-wrap:anywhere}
.card .bj{white-space:nowrap;font-size:13px}
.card .ct{font-size:13px;color:#303030;margin-top:3px;overflow-wrap:anywhere}
.card .mt{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center;font-size:12px;color:#404040}
.chip{display:inline-block;background:var(--face);box-shadow:var(--thin);padding:1px 6px;font-size:12px;color:#000}
.chip.src{background:#e8eefc}
.task-i{font-size:12px;margin-top:6px}
.task-i.late{color:var(--red);font-weight:bold}
.task-i.today{color:#7a4a00;font-weight:bold}
.task-i.none{color:#806000}
.empty{color:#505050;text-align:center;padding:14px 6px;font-size:13px}

/* bitim paneli */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);display:flex;flex-direction:column;z-index:20}
.panel .body{flex:1;overflow-y:auto;padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.grid2 .full{grid-column:1/-1}
@media (max-width:560px){ .grid2{grid-template-columns:1fr} }
.feed{background:#fff;box-shadow:var(--sunken);padding:8px;display:flex;flex-direction:column;gap:8px;max-height:none}
.fi{border-left:3px solid var(--shadow);padding:2px 0 2px 8px}
.fi .when{font-size:12px;color:#505050}
.fi.izoh{border-color:var(--title)}
.fi.tizim,.fi.bosqich{border-color:#b0a890;color:#303030;font-style:italic}
.fi.vazifa{border-color:#c07000}
.fi.vazifa.done .txt{text-decoration:line-through;color:#606060}
.fi .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.composer{border-top:2px groove var(--hi);padding:10px 12px;background:var(--face)}
.tabs{display:flex;gap:2px;margin-bottom:-1px}
.tab{background:var(--face);border:none;padding:5px 12px;cursor:pointer;box-shadow:inset -1px 0 var(--dark),inset 1px 1px var(--hi),inset -2px 0 var(--shadow),inset 2px 2px var(--lite)}
.tab[aria-selected="true"]{position:relative;z-index:1;padding-bottom:7px;margin-top:-2px;font-weight:bold}
.tabbody{box-shadow:var(--raised);padding:10px;background:var(--face)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.25);display:grid;place-items:center;padding:14px;z-index:40}
.modal .win{width:min(460px,100%);max-height:100%;display:flex;flex-direction:column}
.modal .wbody{padding:14px;overflow:auto}

/* roʻyxatlar */
.page{padding:12px}
.pwin{background:var(--face);box-shadow:var(--raised);padding:3px;max-width:1200px}
.pwin .wbody{padding:12px}
.lv-wrap{background:#fff;box-shadow:var(--sunken);overflow:auto;padding:2px}
table.lv{border-collapse:collapse;width:100%;min-width:640px}
.lv th{position:sticky;top:0;background:var(--face);box-shadow:var(--button);text-align:left;font-weight:normal;padding:6px 10px;white-space:nowrap;z-index:1}
.lv td{padding:7px 10px;border-bottom:1px dotted #c8c8c8;vertical-align:top}
.lv tbody tr{cursor:pointer}
.lv tbody tr:hover td{background:#eef2fa}
.lv tbody tr:focus{outline:none}
.lv tbody tr:focus td{background:var(--sel);color:#fff}
.lv tbody tr:focus td a{color:#fff}
.tgroup{margin:0 0 14px}
.tgroup h3{margin:0 0 6px;font-size:14px}
.trow{display:flex;gap:10px;align-items:flex-start;background:#fff;box-shadow:var(--thin);padding:8px 10px;margin-bottom:4px}
.trow .tm{white-space:nowrap;min-width:92px;font-variant-numeric:tabular-nums}
.trow .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.trow .dl{font-size:12.5px;color:#303030}
.trow.late .tm{color:var(--red);font-weight:bold}
.trow input{margin-top:3px;width:17px;height:17px}

/* hisobot */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;box-shadow:var(--sunken);padding:10px 12px}
.stat b{display:block;font-size:22px;font-family:Tahoma,Arial,sans-serif}
.fun{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:6px 10px;align-items:center}
.fbar{height:22px;background:#fff;box-shadow:var(--sunken);padding:3px}
.fbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--title) 0 12px,transparent 12px 14px)}

/* sozlamalar */
.stg{display:grid;grid-template-columns:auto 1fr 150px 140px auto;gap:6px 8px;align-items:center}
@media (max-width:700px){ .stg{grid-template-columns:auto 1fr} }
.sw{width:22px;height:22px;box-shadow:var(--thin);display:inline-block;vertical-align:middle}

@media (max-width:700px){
  :root{--side:64px}
  .nav button{font-size:10.5px}
  .top h1{display:none}
  .col{width:250px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-deal" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" fill="none" stroke="currentColor" stroke-width="2"/><rect x="10" y="4" width="5" height="11" fill="none" stroke="currentColor" stroke-width="2"/><rect x="17" y="4" width="4" height="7" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-task" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 2v4M17 2v4M3 9h18" stroke="currentColor" stroke-width="2"/><path d="M8 14l3 3 5-6" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-cont" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-rep" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="2" fill="none"/></symbol>

<div id="login" hidden>
  <section class="win" role="dialog" aria-labelledby="lTitle">
    <div class="title"><span class="t" id="lTitle">1924 CRM — kirish</span></div>
    <form class="wbody" id="lForm">
      <p style="margin:0 0 12px">Admin panel bilan bir xil email va parol.</p>
      <label for="lEmail">Email:</label>
      <input class="field" id="lEmail" type="email" autocomplete="username" required>
      <label for="lPass">Parol:</label>
      <input class="field" id="lPass" type="password" autocomplete="current-password" required>
      <p class="err" id="lErr" role="alert"></p>
      <div class="row" style="justify-content:flex-end"><button class="btn main" type="submit" id="lBtn">Kirish</button></div>
    </form>
  </section>
</div>

<div id="app" hidden>
  <nav class="nav" aria-label="Boʻlimlar">
    <div class="logo" aria-hidden="true">1924</div>
    <button type="button" data-view="bitimlar"><svg aria-hidden="true"><use href="#i-deal"/></svg>Bitimlar</button>
    <button type="button" data-view="vazifalar"><svg aria-hidden="true"><use href="#i-task"/></svg>Vazifalar<span class="badge" id="taskBadge" hidden></span></button>

    <div class="sp"></div>
    <button type="button" id="logout" title=""><svg aria-hidden="true"><use href="#i-out"/></svg>Chiqish</button>
  </nav>
  <div class="main">
    <header class="top">
      <h1 id="pTitle">Bitimlar</h1>
      <label class="sr" for="vSel">Voronka</label>
      <select class="field" id="vSel" style="width:auto;max-width:260px"></select>
      <label class="sr" for="q">Qidirish</label>
      <input class="field search" id="q" type="search" placeholder="Qidirish: bitim, ism, telefon, teg">
      <span class="sum muted" id="sum" role="status"></span>
      <button class="btn" type="button" id="refresh" title="Yangilash">↻ Yangilash</button>
      <button class="btn main" type="button" id="newDeal">+ Yangi bitim</button>

    <div class="content" id="content"></div>
  </div>
</div>

<!-- bitim paneli -->
<section class="panel win" id="panel" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="title"><span class="t" id="dTitle">Bitim</span><button class="tbtn" type="button" id="dClose" aria-label="Yopish">×</button></div>
  <div class="body" id="dBody"></div>
  <div class="composer" id="dComp"></div>
</section>

<!-- umumiy dialog -->
<div class="modal" id="modal" hidden>
  <section class="win" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="title"><span class="t" id="mTitle"></span><button class="tbtn" type="button" id="mClose" aria-label="Yopish">×</button></div>
    <div class="wbody" id="mBody"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function(){
  "use strict";
  var cfg = window.ZK_CONFIG || {};
  var sb = window.supabase.createClient(cfg.url, cfg.key);

  /* ---------- yordamchilar ---------- */
  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){ var n = document.createElement(tag); if(cls) n.className = cls; if(text != null) n.textContent = text; return n; }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function money(v){ var n = Math.round(Number(v) || 0); return n.toLocaleString("ru-RU").replace(/\u00a0/g," ") + " soʻm"; }
  function digits(s){ return String(s || "").replace(/\D/g, ""); }
  function telKey(s){ var d = digits(s); return d ? d.slice(-9) : ""; }
  function telHref(t){ var d = digits(t); if(d.length === 9) d = "998" + d; return "tel:+" + d; }
  function fmtDT(iso){
    if(!iso) return "—";
    var d = new Date(iso), now = new Date();
    var s = pad(d.getDate()) + "." + pad(d.getMonth()+1) + (d.getFullYear() !== now.getFullYear() ? "." + d.getFullYear() : "");
    return s + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function fmtD(iso){ if(!iso) return "—"; var d = new Date(iso); return pad(d.getDate()) + "." + pad(d.getMonth()+1) + "." + d.getFullYear(); }
  function dayStart(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
  function localInput(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function byId(list, id){ for(var i = 0; i < list.length; i++){ if(list[i].id === id) return list[i]; } return null; }
  function status(t){ $("sum").textContent = t; }

  /* ---------- holat ---------- */
  var S = {me:"", V:[], B:[], D:[], K:[], T:[], view:"bitimlar", vid:null, q:"", loadedAt:0};
  var SOURCES = ["Instagram forma","Instagram Direct","Telegram","Telefon qoʻngʻiroq","Tavsiya","ustoz.html","Boshqa"];
  var COLORS = ["#a6caf0","#fff3a0","#ffd4a0","#d8c4f0","#f4b8c8","#b8e6e0","#b8e6b8","#d0d0d0"];

  function stagesOf(vid){ return S.B.filter(function(b){ return b.voronka_id === vid; }).sort(function(a, b){ return a.tartib - b.tartib || a.id - b.id; }); }
  function firstOpenStage(vid){ var s = stagesOf(vid).filter(function(b){ return b.turi === "oddiy"; }); return s[0] || stagesOf(vid)[0] || null; }
  function contactOf(d){ return d.kontakt_id ? byId(S.K, d.kontakt_id) : null; }
  function openTasksOf(did){ return S.T.filter(function(t){ return t.bitim_id === did && !t.bajarildi; }).sort(function(a, b){ return new Date(a.muddat) - new Date(b.muddat); }); }
  function isLate(t){ return !t.bajarildi && new Date(t.muddat) < new Date(); }
  function isToday(t){ var d = new Date(t.muddat), s = dayStart(new Date()); return d >= s && d < new Date(s.getTime() + 86400000); }

  async function log(did, turi, matn){
    var r = await sb.from("crm_tarix").insert({bitim_id: did, turi: turi, matn: String(matn).slice(0, 2000), muallif: S.me || null}).select("*");
    return r.error ? null : r.data[0];
  }

  /* ---------- kirish ---------- */
  async function boot(){
    var s = await sb.auth.getSession();
    if(s.data && s.data.session){ await enter(s.data.session.user.email); }
    else { $("login").hidden = false; $("lEmail").focus(); }
  }
  async function enter(email){
    var r = await sb.rpc("is_admin");
    if(r.error || r.data !== true){
      await sb.auth.signOut();
      $("app").hidden = true; $("login").hidden = false;
      $("lErr").textContent = "Bu email uchun ruxsat yoʻq.";
      return;
    }
    S.me = email || "";
    $("login").hidden = true; $("app").hidden = false;
    $("logout").title = S.me;
    await loadAll();
    setView("bitimlar");
  }
  $("lForm").addEventListener("submit", async function(e){
    e.preventDefault();
    $("lBtn").disabled = true; $("lErr").textContent = "";
    var r = await sb.auth.signInWithPassword({email: $("lEmail").value.trim(), password: $("lPass").value});
    $("lBtn").disabled = false;
    if(r.error){ $("lErr").textContent = "Email yoki parol notoʻgʻri."; return; }
    $("lPass").value = "";
    await enter(r.data.user.email);
  });
  $("logout").addEventListener("click", async function(){
    closePanel(); closeModal();
    await sb.auth.signOut();
    $("app").hidden = true; $("login").hidden = false; $("lEmail").focus();
  });

  /* ---------- yuklash ---------- */
  async function loadAll(){
    status("Yuklanmoqda…");
    var res = await Promise.all([
      sb.from("crm_voronkalar").select("*").order("tartib", {ascending:true}).limit(100),
      sb.from("crm_bosqichlar").select("*").order("tartib", {ascending:true}).limit(1000),
      sb.from("crm_bitimlar").select("*").order("updated_at", {ascending:false}).limit(5000),
      sb.from("crm_kontaktlar").select("*").order("created_at", {ascending:false}).limit(5000),
      sb.from("crm_vazifalar").select("*").order("muddat", {ascending:true}).limit(5000)
    ]);
    for(var i = 0; i < res.length; i++){ if(res[i].error){ status("Xato: " + res[i].error.message); return false; } }
    S.V = res[0].data; S.B = res[1].data; S.D = res[2].data; S.K = res[3].data; S.T = res[4].data;
    S.D.forEach(function(d){ d.byudjet = Number(d.byudjet) || 0; if(!d.teglar) d.teglar = []; });
    if(!S.vid || !byId(S.V, S.vid)){
      var saved = Number(localStorage.getItem("crm_vid"));
      S.vid = byId(S.V, saved) ? saved : (S.V[0] ? S.V[0].id : null);
    }

      reasons.forEach(function(d){ ul.appendChild(el("li", null, "«" + d.yoqotish_sababi + "» — " + d.nom)); });
      g3.appendChild(ul);
      if(lost.length - reasons.length) g3.appendChild(el("p","muted", "Sababi nomaʼlum: " + (lost.length - reasons.length) + " ta"));
    }
    wb.appendChild(g3);
    status(ds.length + " ta bitim tanlangan davrda");
  }

  /* ---------- sozlamalar ---------- */
  function renderSettings(c){
    var page = el("div","page"); c.appendChild(page);
    var w = el("section","pwin"); page.appendChild(w);
    w.appendChild(el("div","title","Sozlamalar — voronkalar va bosqichlar"));
    var wb = el("div","wbody"); w.appendChild(wb);
    var msg = el("p","err"); msg.setAttribute("role","status");

    var g0 = el("fieldset","grp"); g0.appendChild(el("legend", null, "Voronka"));
    var r0 = el("div","row");
    var v = byId(S.V, S.vid);
    var vn = el("input","field"); vn.maxLength = 60; vn.value = v ? v.nom : ""; vn.style.flex = "1 1 240px"; vn.style.width = "auto"; vn.setAttribute("aria-label","Voronka nomi");
    var vsv = el("button","btn","Nomini saqlash"); vsv.type = "button";
    var vadd = el("button","btn main","+ Yangi voronka"); vadd.type = "button";
    var vdel = el("button","btn del","Voronkani oʻchirish"); vdel.type = "button";
    if(v){ r0.appendChild(vn); r0.appendChild(vsv); }
    r0.appendChild(vadd); if(v) r0.appendChild(vdel);
    g0.appendChild(r0); wb.appendChild(g0);
    vsv.addEventListener("click", async function(){
      var n = vn.value.trim(); if(!n) return;
      var r = await sb.from("crm_voronkalar").update({nom: n.slice(0,60)}).eq("id", v.id).select("*");
      if(r.error){ msg.textContent = "Saqlanmadi: " + r.error.message; return; }
      Object.assign(v, r.data[0]); fillVSel(); msg.className = "ok"; msg.textContent = "Saqlandi.";
    });
    vadd.addEventListener("click", async function(){
      var n = await askText("Yangi voronka", "Voronka nomi:", "Masalan: B2B buyurtmalar");
      if(!n) return;
      var r = await sb.from("crm_voronkalar").insert({nom: n.slice(0,60), tartib: S.V.length + 1}).select("*");
      if(r.error){ msg.textContent = "Saqlanmadi: " + r.error.message; return; }
      var nv = r.data[0]; S.V.push(nv);
      var base = [["Yangi ariza","#a6caf0","oddiy"],["Bogʻlanildi","#fff3a0","oddiy"],["Muvaffaqiyatli","#b8e6b8","yutuq"],["Yoʻqotildi","#d0d0d0","yoqotish"]];
      var rs = await sb.from("crm_bosqichlar").insert(base.map(function(x, i){ return {voronka_id: nv.id, nom: x[0], rang: x[1], turi: x[2], tartib: i + 1}; })).select("*");
      if(!rs.error) S.B = S.B.concat(rs.data);
      S.vid = nv.id; localStorage.setItem("crm_vid", S.vid); fillVSel(); render();
    });
    vdel.addEventListener("click", async function(){
      var n = S.D.filter(function(d){ return d.voronka_id === v.id; }).length;
      if(n){ msg.className = "err"; msg.textContent = "Voronkada " + n + " ta bitim bor — avval ularni boshqa voronkaga oʻtkazing yoki oʻchiring."; return; }
      if(!(await confirmBox("Voronkani oʻchirish", "«" + v.nom + "» va uning bosqichlari oʻchiriladi.", "Ha, oʻchirish"))) return;
      var r = await sb.from("crm_voronkalar").delete().eq("id", v.id).select("id");
      if(r.error || !r.data.length){ msg.textContent = "Oʻchirilmadi."; return; }
      S.V = S.V.filter(function(x){ return x.id !== v.id; }); S.B = S.B.filter(function(b){ return b.voronka_id !== v.id; });
      S.vid = S.V[0] ? S.V[0].id : null; fillVSel(); render();
    });
    if(!v){ wb.appendChild(msg); return; }

    var g1 = el("fieldset","grp"); g1.appendChild(el("legend", null, "Bosqichlar"));
    g1.appendChild(el("p","muted","Nom va rang oʻzgarishi darhol saqlanadi. «Yutuq» va «Yoʻqotish» — yopilgan bitimlar uchun."));
    var grid = el("div","stg");
    var st = stagesOf(v.id);
    st.forEach(function(s, idx){
      var mv = el("div","row"); mv.style.gap = "2px";
      var up = el("button","btn sm","↑"); up.type = "button"; up.disabled = idx === 0; up.setAttribute("aria-label","Yuqoriga: " + s.nom);
      var dn = el("button","btn sm","↓"); dn.type = "button"; dn.disabled = idx === st.length - 1; dn.setAttribute("aria-label","Pastga: " + s.nom);
      mv.appendChild(up); mv.appendChild(dn); grid.appendChild(mv);
      var nm = el("input","field"); nm.maxLength = 40; nm.value = s.nom; nm.setAttribute("aria-label","Bosqich nomi"); grid.appendChild(nm);
      var cs = el("select","field"); cs.setAttribute("aria-label","Rang");
      COLORS.forEach(function(col){ var o = el("option", null, "■ " + col); o.value = col; o.style.background = col; if(col.toLowerCase() === s.rang.toLowerCase()) o.selected = true; cs.appendChild(o); });
      if(COLORS.indexOf(s.rang.toLowerCase()) === -1){ var oc = el("option", null, "■ " + s.rang); oc.value = s.rang; oc.selected = true; cs.appendChild(oc); }
      cs.style.background = s.rang; grid.appendChild(cs);
      var ty = el("select","field"); ty.setAttribute("aria-label","Turi");
      [["oddiy","Oddiy"],["yutuq","Yutuq ✓"],["yoqotish","Yoʻqotish ✕"]].forEach(function(o){ var x = el("option", null, o[1]); x.value = o[0]; if(o[0] === s.turi) x.selected = true; ty.appendChild(x); });
      grid.appendChild(ty);
      var del = el("button","btn sm del","Oʻchirish"); del.type = "button"; grid.appendChild(del);
      async function upd(patch){
        var r = await sb.from("crm_bosqichlar").update(patch).eq("id", s.id).select("*");
        if(r.error){ msg.className = "err"; msg.textContent = "Saqlanmadi: " + r.error.message; return false; }
        Object.assign(s, r.data[0]); msg.className = "ok"; msg.textContent = "Saqlandi."; return true;
      }
      nm.addEventListener("change", function(){ var n = nm.value.trim(); if(n) upd({nom: n.slice(0,40)}); else nm.value = s.nom; });
      cs.addEventListener("change", function(){ cs.style.background = cs.value; upd({rang: cs.value}); });
      ty.addEventListener("change", function(){ upd({turi: ty.value}); });
      async function swap(other){
        var a = s.tartib, b = other.tartib; if(a === b){ a = idx; b = idx + (other === st[idx+1] ? 1 : -1); }
        var r1 = await sb.from("crm_bosqichlar").update({tartib: b}).eq("id", s.id).select("*");
        var r2 = await sb.from("crm_bosqichlar").update({tartib: a}).eq("id", other.id).select("*");
        if(!r1.error) Object.assign(s, r1.data[0]); if(!r2.error) Object.assign(other, r2.data[0]);
        render();
      }
      up.addEventListener("click", function(){ swap(st[idx-1]); });
      dn.addEventListener("click", function(){ swap(st[idx+1]); });
      del.addEventListener("click", async function(){
        var n = S.D.filter(function(d){ return d.bosqich_id === s.id; }).length;
        if(n){ msg.className = "err"; msg.textContent = "«" + s.nom + "» bosqichida " + n + " ta bitim bor — avval ularni boshqa bosqichga oʻtkazing."; return; }
        if(!(await confirmBox("Bosqichni oʻchirish", "«" + s.nom + "» bosqichi oʻchiriladi.", "Ha, oʻchirish"))) return;
        var r = await sb.from("crm_bosqichlar").delete().eq("id", s.id).select("id");
        if(r.error || !r.data.length){ msg.className = "err"; msg.textContent = "Oʻchirilmadi."; return; }
        S.B = S.B.filter(function(b){ return b.id !== s.id; }); render();
      });
    });
    g1.appendChild(grid);
    var add = el("button","btn main","+ Bosqich"); add.type = "button"; add.style.marginTop = "10px"; g1.appendChild(add);
    add.addEventListener("click", async function(){
      var n = await askText("Yangi bosqich", "Bosqich nomi:", "Masalan: Shartnoma");
      if(!n) return;
      var opens = st.filter(function(s){ return s.turi === "oddiy"; });
      var pos = opens.length ? opens[opens.length - 1].tartib + 1 : 1;
      for(var i = 0; i < st.length; i++){ if(st[i].tartib >= pos){ var rr = await sb.from("crm_bosqichlar").update({tartib: st[i].tartib + 1}).eq("id", st[i].id).select("*"); if(!rr.error) Object.assign(st[i], rr.data[0]); } }
      var r = await sb.from("crm_bosqichlar").insert({voronka_id: v.id, nom: n.slice(0,40), rang: COLORS[opens.length % 5], turi: "oddiy", tartib: pos}).select("*");
      if(r.error){ msg.className = "err"; msg.textContent = "Saqlanmadi: " + r.error.message; return; }
      S.B.push(r.data[0]); render();
    });
    wb.appendChild(g1);
    wb.appendChild(msg);
    status("");
  }

  boot();
})();
</script>
</body>
</html>
