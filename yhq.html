<script>
/* ============ LOTIN → KIRILL ============ */
const M2={"sh":"ш","Sh":"Ш","SH":"Ш","ch":"ч","Ch":"Ч","CH":"Ч","yo":"ё","Yo":"Ё","yu":"ю","Yu":"Ю","ya":"я","Ya":"Я","ye":"е","Ye":"Е","ts":"ц"};
const M1={a:"а",b:"б",c:"с",d:"д",f:"ф",g:"г",h:"ҳ",i:"и",j:"ж",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",q:"қ",r:"р",s:"с",t:"т",u:"у",v:"в",w:"в",x:"х",y:"й",z:"з",
A:"А",B:"Б",C:"С",D:"Д",F:"Ф",G:"Г",H:"Ҳ",I:"И",J:"Ж",K:"К",L:"Л",M:"М",N:"Н",O:"О",P:"П",Q:"Қ",R:"Р",S:"С",T:"Т",U:"У",V:"В",W:"В",X:"Х",Y:"Й",Z:"З",
"\u0001":"ў","\u0002":"Ў","\u0003":"ғ","\u0004":"Ғ"};
function cyr(t){
  t=t.replace(/[\u2018\u2019\u02BB\u02BC`]/g,"'").replace(/o'/g,"\u0001").replace(/O'/g,"\u0002").replace(/g'/g,"\u0003").replace(/G'/g,"\u0004");
  let o="",i=0;const L=c=>c&&/[a-zA-Z\u0001-\u0004]/.test(c);
  while(i<t.length){const d=t.substr(i,2);
    if(M2[d]!==undefined){o+=M2[d];i+=2;continue}
    const c=t[i];
    if(c==="'"){o+=L(t[i-1])?"ъ":"'";i++;continue}
    if(c==="e"||c==="E"){o+=L(t[i-1])?(c==="e"?"е":"Е"):(c==="e"?"э":"Э");i++;continue}
    o+=(M1[c]!==undefined?M1[c]:c);i++}
  return o;
}
const T=s=>S.cyr?String(s).split(/(<svg[\s\S]*?<\/svg>|<[^>]*>)/g).map((x,i)=>i%2?x:cyr(x)).join(''):s;

/* ============ SAQLASH ============ */
const KEY="yhqreels:v2";
let S={cyr:false,pos:0,days:[],seen:0,right:0,wrong:0,sessions:0,xp:0,best:0,stats:{}};
const mem={};
async function load(){let r=null;
  try{if(window.storage){const x=await window.storage.get(KEY);r=x&&x.value}}catch(e){}
  if(r===null){try{r=localStorage.getItem(KEY)}catch(e){r=mem[KEY]||null}}
  if(r){try{S=Object.assign(S,JSON.parse(r))}catch(e){}}}
async function save(){const r=JSON.stringify(S);
  try{if(window.storage){await window.storage.set(KEY,r);return}}catch(e){}
  try{localStorage.setItem(KEY,r)}catch(e){mem[KEY]=r}}
const day=()=>new Date().toISOString().slice(0,10);
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function streak(){const s=new Set(S.days);let n=0,i=s.has(day())?0:1;for(;i<400;i++){if(s.has(addD(-i)))n++;else break}return n}
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ============ FEED ============ */
const GORD=["ogoh","imtiyoz","taqiq","buyruq","axborot","servis","qoshimcha"];
const GQ={ogoh:["ogoh"],imtiyoz:["imtiyoz"],taqiq:["taqiq"],buyruq:["buyruq"],axborot:[],servis:[],qoshimcha:["lavha"]};
const GINT={
 ogoh:{n:"A",t:"Ogohlantiruvchi belgilar",s:"Uchburchak, qizil hoshiya. Hech narsani taqiqlamaydi — oldindagi xavfni aytadi."},
 imtiyoz:{n:"B",t:"Imtiyoz belgilari",s:"Kim birinchi o'tadi. Shakllari atayin bir-biriga o'xshamaydi."},
 taqiq:{n:"C",t:"Taqiqlovchi belgilar",s:"Doira, qizil hoshiya. Nima mumkin emasligini aytadi."},
 buyruq:{n:"D",t:"Buyuruvchi belgilar",s:"Ko'k doira. Taqiqlamaydi — buyuradi: faqat shu yo'nalishda yur."},
 axborot:{n:"E",t:"Axborot-ishorat belgilari",s:"Ko'k to'rtburchak. Yo'l rejimi haqida xabar beradi."},
 servis:{n:"F",t:"Servis belgilari",s:"Ko'k fon, oq maydoncha. Yaqin atrofda nima borligini ko'rsatadi."},
 qoshimcha:{n:"G",t:"Qo'shimcha lavhalar",s:"Belgi ostidagi oq to'rtburchak. Belgini aniqlashtiradi: masofa, ta'sir doirasi, yo'nalish."}};
const CH=[1,2,3,4,5,6,10];
let FEED=[],SIGNS=[];
function buildFeed(){
  const F=[],usedQ=new Set();
  F.push({t:"alif"});
  FACT.filter(f=>f.v==="shakl").forEach(f=>F.push({t:"fact",f}));
  for(const g of GORD){
    const sg=SIGNS.map((s,i)=>i).filter(i=>SIGNS[i].g===g);if(!sg.length)continue;
    F.push({t:"gintro",g});
    const qs=Q.map((q,i)=>i).filter(i=>GQ[g].includes(Q[i].m));
    let si=0,qi=0,blk=0;
    while(si<sg.length){
      const chunk=[];for(let k=0;k<5&&si<sg.length;k++){chunk.push(sg[si]);F.push({t:"sign",s:sg[si++]})}
      // ko'rgan belgilar bo'yicha vizual test
      if(chunk.length>=2)F.push({t:"sq",s:chunk[Math.floor(Math.random()*chunk.length)],m:blk%2?"n2s":"s2n"});
      const need=Math.max(1,Math.round(qs.length/Math.ceil(sg.length/5)));
      for(let k=0;k<need&&qi<qs.length;k++){F.push({t:"quiz",q:qs[qi]});usedQ.add(qs[qi++])}
      blk++;
    }
    while(qi<qs.length){F.push({t:"quiz",q:qs[qi]});usedQ.add(qs[qi++])}
    F.push({t:"mile",g,n:sg.length});
  }
  F.push({t:"partB"});
  for(const c of CH){
    const facts=FACT.filter(f=>f.c===c&&f.v!=="shakl");
    const qs=Q.map((q,i)=>i).filter(i=>QCHAP[Q[i].m]===c&&!usedQ.has(i));
    if(!facts.length&&!qs.length)continue;
    F.push({t:"chap",c});
    let ti=0,qi=0,xi=0;
    const blocks=Math.max(1,Math.ceil(facts.length/4));
    while(ti<facts.length||qi<qs.length){
      for(let k=0;k<4&&ti<facts.length;k++){const f=facts[ti++];F.push({t:"fact",f});
        if(c===4&&/chorraha|O'ng qo'l|Asosiy yo'l burilib|Yashil chiroq/.test(f.t)&&xi<XQ.length){F.push({t:"xq",x:xi++});F.push({t:"xq",x:xi++})}}
      const need=Math.max(3,Math.round(qs.length/blocks));
      for(let k=0;k<need&&qi<qs.length;k++)F.push({t:"quiz",q:qs[qi++]});
    }
    while(c===4&&xi<XQ.length)F.push({t:"xq",x:xi++});
  }
  F.push({t:"fin"});
  return F;
}

/* ============ SESSIYA ============ */
let base=0,cur=0,ended=false,sess={seen:0,right:0,wrong:0,xp:0},combo=0,io=null;
const WIN=70;

function render(){
  base=S.pos;ended=false;
  const f=document.getElementById('feed');
  const n=Math.min(WIN,FEED.length-base);
  let h='';for(let i=0;i<n;i++)h+=card(FEED[base+i],i);
  h+=endCard(n);
  f.innerHTML=h;f.scrollTop=0;cur=0;
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('vis');const i=+e.target.dataset.i;
      if(!isNaN(i)&&i>cur){cur=i;bump()}}
  })},{threshold:.5});
  document.querySelectorAll('.reel').forEach(el=>io.observe(el));
  paintTop();
}
function bump(){
  S.seen++;sess.seen++;
  S.pos=Math.min(FEED.length-1,base+cur);
  if(!S.days.includes(day()))S.days.push(day());
  paintTop();save();
}

/* ---- kartochkalar ---- */
const SW=()=>`<div class="swipe">&#8593; ${T("Yuqoriga suring")}</div>`;
function card(r,i){
  if(r.t==="alif")return `<section class="reel chap" data-i="${i}"><div class="in">
    <div class="tagline">${T("A QISM")}</div><div class="no ttl">${T("Yo'l alifbosi")}</div>
    <p style="margin:12px 0 16px">${T(`Avval belgilar — ${SIGNS.length} ta. Keyin qoidalar kitob tartibida.`)}</p>
    <div class="scene" style="max-width:320px;margin:0 auto">${SC.shakl}</div></div>${SW()}</section>`;
  if(r.t==="partB")return `<section class="reel chap" data-i="${i}"><div class="in">
    <div class="tagline">${T("B QISM")}</div><div class="no ttl">${T("Endi qoidalar")}</div>
    <p style="margin:12px 0 0">${T("Belgilarni bilasan. Endi ular qanday ishlashini kitob tartibida ko'ramiz — har bir qoida bitta rasm bilan.")}</p></div>${SW()}</section>`;
  if(r.t==="fin")return `<section class="reel chap" data-i="${i}"><div class="in">
    <div class="no" style="color:var(--grn)">&#10003;</div><h2>${T("Kitob tugadi")}</h2>
    <p style="margin-top:10px">${T("Endi lentani boshidan qayta o'ta — ikkinchi marta hammasi tezroq o'rnashadi. Va sinov imtihonlarini yech.")}</p>
    <button class="b" style="margin-top:22px" onclick="S.pos=0;save();location.reload()">${T("Boshidan")}</button></div></section>`;
  if(r.t==="gintro"){const g=GINT[r.g],n=SIGNS.filter(x=>x.g===r.g).length;
    return `<section class="reel chap" data-i="${i}"><div class="in"><div class="no">${g.n}</div><h2>${T(g.t)}</h2><p>${T(g.s)}</p>
    <p style="color:var(--yel);margin-top:14px;font-weight:600">${n} ${T("ta belgi")}</p></div>${SW()}</section>`}
  if(r.t==="mile"){const g=GINT[r.g];
    return `<section class="reel chap mile" data-i="${i}"><div class="in">
    <div class="star">&#9733;</div><div class="tagline">${T(g.n+" GURUH TUGADI")}</div><h2>${T(g.t)}</h2>
    <p style="margin-top:8px">${r.n} ${T("ta belgi ko'rildi")}</p><div class="xpbig">+25 XP</div></div>${SW()}</section>`}
  if(r.t==="chap"){const c=CHAP[r.c];
    return `<section class="reel chap" data-i="${i}"><div class="in"><div class="tagline">${T("B QISM · KITOB")}</div>
    <div class="no">${c.n}</div><h2>${T(c.t)}</h2><p>${T(c.s)}</p></div>${SW()}</section>`}
  if(r.t==="fact"){const f=r.f;
    return `<section class="reel fact" data-i="${i}"><div class="in"><div class="tagline">${T(CHAP[f.c]?CHAP[f.c].n+"-BOB · NAZARIYA":"NAZARIYA")}</div>
    ${f.v&&SC[f.v]?`<div class="scene">${SC[f.v]}</div>`:`<div class="hook${f.h.length>7?' sm':''}">${T(f.h)}</div>`}
    <h2>${T(f.t)}</h2><p>${T(f.p)}</p><div class="why">${T(f.w)}</div></div>${SW()}</section>`}
  if(r.t==="sign"){const s=SIGNS[r.s];
    return `<section class="reel" data-i="${i}"><div class="in"><div class="sw">${s.s}</div><div class="sgroup">${T(SG[s.g])}</div>
    <div class="sname">${T(s.n)}</div><div class="sdesc">${T(s.d)}</div></div>${SW()}</section>`}
  if(r.t==="sq"){const s=SIGNS[r.s],g=s.g;
    let pool=SIGNS.map((x,k)=>k).filter(k=>k!==r.s&&SIGNS[k].g===g);
    if(pool.length<3)pool=pool.concat(SIGNS.map((x,k)=>k).filter(k=>k!==r.s&&SIGNS[k].g!==g));
    const opts=sh([r.s,...sh(pool).slice(0,3)]),right=opts.indexOf(r.s);
    if(r.m==="s2n")return `<section class="reel" data-i="${i}" data-a="${right}" data-k="s${r.s}" data-w="${esc(s.n+" — "+s.d)}"><div class="in">
      <div class="tagline">${T("TEZ TEST · BU QANDAY BELGI?")}</div><div class="qs">${s.s}</div>
      <div class="opts">${opts.map((k,j)=>`<button class="o" onclick="ans(this,${j})">${T(SIGNS[k].n)}</button>`).join('')}</div>
      <div class="ex" style="display:none"></div></div><div class="swipe hide">&#8593;</div></section>`;
    return `<section class="reel" data-i="${i}" data-a="${right}" data-k="s${r.s}" data-w="${esc(s.d)}"><div class="in">
      <div class="tagline">${T("TEZ TEST · QAYSI BELGI?")}</div><div class="q">${T(s.n)}</div>
      <div class="sgrid">${opts.map((k,j)=>`<button class="sopt" onclick="ans(this,${j})">${SIGNS[k].s}</button>`).join('')}</div>
      <div class="ex" style="display:none"></div></div><div class="swipe hide">&#8593;</div></section>`}
  if(r.t==="xq"){const x=XQ[r.x],ord=sh(x.o.map((_,k)=>k)),right=ord.indexOf(x.a);
    return `<section class="reel" data-i="${i}" data-a="${right}" data-k="x${r.x}" data-w="${esc(x.e)}"><div class="in">
      <div class="tagline">${T("CHORRAHA · TARTIBGA SOLINMAGAN")}</div><div class="xs">${drawX(x)}</div><div class="q" style="font-size:17px">${T(x.q)}</div>
      <div class="opts">${ord.map((k,j)=>`<button class="o" onclick="ans(this,${j})">${T(x.o[k])}</button>`).join('')}</div>
      <div class="ex" style="display:none"></div></div><div class="swipe hide">&#8593;</div></section>`}
  const q=Q[r.q],ord=sh(q.o.map((_,k)=>k)),right=ord.indexOf(q.a);
  return `<section class="reel" data-i="${i}" data-a="${right}" data-k="q${r.q}" data-w="${esc(q.e)}"><div class="in">
    <div class="tagline">${T("TEST · "+MODULES[q.m])}</div><div class="q">${T(q.q)}</div>
    <div class="opts">${ord.map((k,j)=>`<button class="o" onclick="ans(this,${j})">${T(q.o[k])}</button>`).join('')}</div>
    <div class="ex" style="display:none"></div></div><div class="swipe hide">&#8593;</div></section>`;
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function ans(el,k){
  const sec=el.closest('.reel');if(sec.dataset.done)return;sec.dataset.done="1";
  const right=+sec.dataset.a,ok=k===right,key=sec.dataset.k;
  sec.querySelectorAll('.o,.sopt').forEach((b,j)=>{b.onclick=null;if(j===right)b.classList.add('ok');else if(j===k)b.classList.add('no');else b.classList.add('dim')});
  const st=S.stats[key]||{w:0,r:0};ok?st.r++:st.w++;S.stats[key]=st;
  let gain=0;
  if(ok){S.right++;sess.right++;combo++;gain=10+(combo>=3?5:0)+(combo>=6?5:0);S.xp+=gain;sess.xp+=gain;if(combo>S.best)S.best=combo;vib(25)}
  else{S.wrong++;sess.wrong++;combo=0;vib([40,40,40])}
  const ex=sec.querySelector('.ex');ex.style.display='block';
  ex.innerHTML=`<b class="${ok?'g':'r'}">${T(ok?"To'g'ri!":"Xato")}${ok&&combo>=3?` <span class="cb">${combo}&#215; ketma-ket</span>`:''}</b>${T(sec.dataset.w)}
    <button class="nx" onclick="nextReel(this)">${T("Keyingisi")} &#8593;</button>`;
  if(ok)toast("+"+gain+" XP");
  paintTop();save();
}
function nextReel(el){const s=el.closest('.reel').nextElementSibling;if(s)s.scrollIntoView({behavior:'smooth'})}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1100)}
function paintTop(){
  document.getElementById('xp').textContent=S.xp;
  const c=document.getElementById('cmb');c.textContent=combo>=2?combo+"\u00D7":"";c.style.display=combo>=2?'':'none';
  const p=Math.round(S.pos/Math.max(1,FEED.length-1)*100);
  document.querySelector('#tb i').style.width=p+'%';
  document.getElementById('pct').textContent=p+'%';
}

/* ---- sessiya yakuni ---- */
function endCard(i){return `<section class="reel end" id="endCard" data-i="${i}"><div class="in">
  <div class="big">&#10003;</div><h2 style="font-size:29px;margin-top:12px" id="endTtl">${T("Yaxshi ish")}</h2>
  <p style="color:var(--mu);margin:8px 0 0" id="endSub"></p><div class="stats" id="endStats"></div>
  <p class="teaser" id="teaser"></p>
  <button class="b" onclick="goOn()">${T("Davom etish")}</button><button class="b b2" onclick="location.reload()">${T("Yopish")}</button>
  <div class="credit">${T("Belgi tasvirlari: Wikimedia Commons, CC BY-SA 4.0. Qoidalar: O'zR VM 12.04.2022-y. 172-son qarori.")}</div></div></section>`}
function nextTitle(pos){for(let i=pos;i<FEED.length;i++){const r=FEED[i];
  if(r.t==="gintro")return GINT[r.g].t;if(r.t==="chap")return CHAP[r.c].t;if(r.t==="partB")return "Qoidalar — B qism";
  if(r.t==="xq")return "Chorraha vaziyatlari";}return "Yakun"}
function stopSession(){
  if(ended)return;ended=true;
  const reels=[...document.querySelectorAll('.reel')],end=document.getElementById('endCard'),at=Math.min(cur+1,reels.length-1);
  if(reels[at]&&end&&reels[at]!==end)reels[at].parentNode.insertBefore(end,reels[at]);
  reels.forEach((r,i)=>{if(r!==end&&i>=at)r.style.display='none'});
  S.pos=Math.min(FEED.length-1,base+cur+1);S.sessions++;
  if(!S.days.includes(day()))S.days.push(day());
  const milesXp=FEED.slice(base,S.pos).filter(r=>r.t==="mile").length*25;S.xp+=milesXp;sess.xp+=milesXp;save();
  const pct=Math.round(S.pos/Math.max(1,FEED.length-1)*100);
  const done=S.pos>=FEED.length-1;
  document.getElementById('endTtl').textContent=T(done?"Kitob tugadi":(sess.seen>=25?"Zo'r sessiya":"Yaxshi ish"));
  document.getElementById('endSub').textContent=T(`Kitob bo'yicha ${pct}% ko'rildi`);
  document.getElementById('endStats').innerHTML=`<div class="st"><b>${sess.seen}</b><span>${T("rils")}</span></div>
   <div class="st"><b>${sess.right}/${sess.right+sess.wrong}</b><span>${T("test")}</span></div>
   <div class="st"><b id="xpc">0</b><span>XP</span></div><div class="st"><b>${streak()}</b><span>${T("kun")}</span></div>`;
  document.getElementById('teaser').innerHTML=done?T("Lentani boshidan qayta o'tsang bo'ladi.")
    :T("Keyingi safar shu yerdan davom etadi: ")+"<b>"+T(nextTitle(S.pos))+"</b>";
  paintTop();
  setTimeout(()=>{if(end)end.scrollIntoView({behavior:'smooth'})},120);
  let v=0;const tgt=sess.xp,st=setInterval(()=>{v=Math.min(tgt,v+Math.max(1,Math.ceil(tgt/40)));
    const e=document.getElementById('xpc');if(e)e.textContent=v;if(v>=tgt)clearInterval(st)},30);
}
function goOn(){sess={seen:0,right:0,wrong:0,xp:0};combo=0;render()}
function flip(){S.cyr=!S.cyr;save();
  if(document.getElementById('prof').classList.contains('on'))drawProf();
  const c=cur;render();
  setTimeout(()=>{const t=document.querySelector(`.reel[data-i="${c}"]`);if(t)t.scrollIntoView()},60)}

(async function(){await load();SIGNS=SIGNDATA;FEED=buildFeed();
  if(S.pos>=FEED.length-1)S.pos=Math.max(0,FEED.length-2);
  render();await save();
  if(S.pos>0)toast(T("Davom etyapmiz"));})();
</script>
<script>
/* ============ PROFIL: IMTIHONGACHA YO'L XARITASI ============ */

/* Bosqichlar FEED tuzilishidan hisoblanadi */
function stages(){
  const b=FEED.findIndex(r=>r.t==="partB");
  const ch=c=>{const i=FEED.findIndex(r=>r.t==="chap"&&r.c===c);return i<0?b:i};
  const end=FEED.length-1;
  const S1=[0,b], S2=[b,ch(3)], S3=[ch(3),ch(5)], S4=[ch(5),ch(10)], S5=[ch(10),end];
  return [
   {t:"Yo'l alifbosi",s:"98 ta belgi, 7 guruh",a:S1[0],b:S1[1]},
   {t:"Umumiy qoidalar va chiziqlar",s:"Atamalar, yo'l chiziqlari",a:S2[0],b:S2[1]},
   {t:"Svetofor va harakat tartibi",s:"Tartibga soluvchi, tezlik, chorrahalar",a:S3[0],b:S3[1]},
   {t:"Murakkab sharoit va texnika",s:"Magistral, shatak, nosozliklar",a:S4[0],b:S4[1]},
   {t:"Birinchi tibbiy yordam",s:"YTH joyida",a:S5[0],b:S5[1]}
  ];
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function accuracy(){const n=S.right+S.wrong;return n<10?null:S.right/n}
function readiness(){
  const cov=clamp(S.pos/Math.max(1,FEED.length-1),0,1);
  const acc=accuracy();
  const af=acc===null?0:clamp((acc-0.5)/0.4,0,1);
  return Math.round(60*cov+40*af);
}
function weakTopics(){
  const m={};
  for(const [k,v] of Object.entries(S.stats)){
    if(!v.w)continue;
    let name=null;
    if(k[0]==="q"){const q=Q[+k.slice(1)];if(q)name=MODULES[q.m]}
    else if(k[0]==="s"){const s=SIGNS[+k.slice(1)];if(s)name=SG[s.g]}
    else if(k[0]==="x")name="Chorraha vaziyatlari";
    if(!name)continue;
    m[name]=m[name]||{w:0,r:0};m[name].w+=v.w;m[name].r+=v.r||0;
  }
  return Object.entries(m).sort((a,b)=>b[1].w-a[1].w).slice(0,5);
}
function daysLeft(){
  if(!S.exam)return null;
  const d=Math.ceil((new Date(S.exam+"T00:00:00")-new Date(day()+"T00:00:00"))/86400000);
  return d;
}

/* ---- xarita SVG ---- */
function mapSVG(){
  const st=stages(),P=[[62,470],[252,398],[68,318],[252,238],[68,158],[160,58]];
  const done=st.map(x=>clamp((S.pos-x.a)/Math.max(1,x.b-x.a),0,1));
  let road="",marks="";
  for(let i=0;i<P.length-1;i++){
    const [x1,y1]=P[i],[x2,y2]=P[i+1],f=done[i]||0;
    road+=`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="#252A31" stroke-width="26" stroke-linecap="round"/>`;
    road+=`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="#EFEDE6" stroke-width="2" stroke-dasharray="9 9" opacity=".35"/>`;
    if(f>0){const px=x1+(x2-x1)*f,py=y1+(y2-y1)*f;
      road+=`<path d="M${x1} ${y1}L${px} ${py}" stroke="${YE}" stroke-width="26" stroke-linecap="round" opacity=".9"/>`}
  }
  st.forEach((x,i)=>{
    const [cx,cy]=P[i],f=done[i]||0,full=f>=1,act=f>0&&f<1;
    const fill=full?YE:(act?"#3A3F48":"#22262D"),col=full?"#0F1216":(act?YE:"#6C7480");
    marks+=`<g><circle cx="${cx}" cy="${cy}" r="21" fill="${fill}" stroke="${act?YE:"#3A3F48"}" stroke-width="${act?3:2}"/>
      <text x="${cx}" y="${cy+6}" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-weight="700" font-size="18" fill="${col}">${full?"&#10003;":i+1}</text></g>`;
    const nmT=T(x.t.length>24?x.t.slice(0,23)+"\u2026":x.t),pcT=Math.round(f*100)+"%";
    const wpx=Math.max(nmT.length*6.4,42)+16,lft=cx<160,bx=lft?cx+27:cx-27-wpx;
    marks+=`<rect x="${bx}" y="${cy-17}" width="${wpx}" height="34" rx="8" fill="#0F1216" opacity=".82"/>`;
    marks+=`<text x="${bx+8}" y="${cy-2}" font-family="Barlow,sans-serif" font-weight="600" font-size="12.5" fill="${full||act?"#EFEDE6":"#79818C"}">${nmT}</text>`;
    marks+=`<text x="${bx+8}" y="${cy+13}" font-family="Barlow,sans-serif" font-weight="600" font-size="11.5" fill="${full?GN:(act?YE:"#5A626C")}">${pcT}</text>`;
  });
  const rd=readiness(),ex=P[5];
  const fg=rd>=80?"#0F1216":"#8B939E";
  const flag=`<g transform="translate(${ex[0]-13} ${ex[1]-13})"><path d="M2 0v26" stroke="${fg}" stroke-width="2.6"/>
    <g fill="${fg}"><rect x="5" y="1" width="6.5" height="6"/><rect x="18" y="1" width="6.5" height="6"/><rect x="11.5" y="7" width="6.5" height="6"/>
    <rect x="5" y="13" width="6.5" height="6"/><rect x="18" y="13" width="6.5" height="6"/></g>
    <rect x="5" y="1" width="19.5" height="18" fill="none" stroke="${fg}" stroke-width="1.4"/></g>`;
  marks+=`<g><circle cx="${ex[0]}" cy="${ex[1]}" r="34" fill="${rd>=80?GN:"#22262D"}" stroke="${rd>=80?GN:"#3A3F48"}" stroke-width="3"/>
    ${rd>=80?`<text x="${ex[0]}" y="${ex[1]+10}" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-weight="700" font-size="30" fill="#0F1216">&#10003;</text>`:flag}</g>
    <text x="${ex[0]}" y="${ex[1]-46}" text-anchor="middle" font-family="'Barlow Condensed',sans-serif" font-weight="700" font-size="21" fill="${YE}">IMTIHON</text>
    <text x="${ex[0]}" y="${ex[1]+56}" text-anchor="middle" font-family="Barlow,sans-serif" font-weight="600" font-size="12" fill="${rd>=80?GN:"#79818C"}">${T("tayyorlik")} ${rd}%</text>`;
  /* joriy o'rin — mashina */
  let ci=done.findIndex(f=>f>0&&f<1);if(ci<0)ci=done.every(f=>f>=1)?5:0;
  if(ci<5){const [x1,y1]=P[ci],[x2,y2]=P[ci+1],f=done[ci]||0;
    const px=x1+(x2-x1)*f,py=y1+(y2-y1)*f,ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI+90;
    marks+=`<g transform="translate(${px} ${py}) rotate(${ang})"><rect x="-8" y="-14" width="16" height="28" rx="4" fill="${YE}" stroke="#0F1216" stroke-width="2"/></g>`}
  return `<svg viewBox="0 0 320 510" xmlns="http://www.w3.org/2000/svg">${road}${marks}</svg>`;
}

/* ---- profil ekrani ---- */
function openProf(){
  document.getElementById('prof').classList.add('on');
  document.body.style.overflow='hidden';
  drawProf();
}
function closeProf(){document.getElementById('prof').classList.remove('on');document.body.style.overflow=''}
function setExam(v){S.exam=v||null;save();drawProf()}
function jump(a){if(!confirm(T("Lentani shu bosqichdan boshlaymizmi?")))return;S.pos=a;save();location.reload()}
function resetAll(){if(!confirm(T("Butun progress o'chiriladi. Davom etamizmi?")))return;
  S={cyr:S.cyr,pos:0,days:[],seen:0,right:0,wrong:0,sessions:0,xp:0,best:0,stats:{},exam:null};save();location.reload()}

function drawProf(){
  const rd=readiness(),acc=accuracy(),st=stages(),dl=daysLeft();
  const rest=Math.max(0,FEED.length-1-S.pos);
  let pace="";
  if(dl!==null){
    if(dl<0)pace=`<div class="warn">${T("Imtihon sanasi o'tib ketdi — yangi sana qo'y.")}</div>`;
    else if(dl===0)pace=`<div class="warn ok">${T("Imtihon bugun. Omad!")}</div>`;
    else{
      const per=Math.ceil(rest/dl),mins=Math.max(1,Math.round(per*20/60));
      pace=`<div class="warn ${mins<=12?'ok':(mins<=25?'':'bad')}">${T(`Ulgurish uchun kuniga ${per} ta kartochka — taxminan ${mins} daqiqa`)}${mins>25?` — ${T("sanani surish kerak")}`:''}</div>`;
    }
  }
  const w=weakTopics();
  document.getElementById('profBody').innerHTML=`
   <div class="ring">
     <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" style="stroke:var(--line)" stroke-width="12"/>
     <circle cx="60" cy="60" r="52" fill="none" stroke="${rd>=80?GN:YE}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${(rd/100*326).toFixed(0)} 326" transform="rotate(-90 60 60)"/></svg>
     <div class="rv"><b>${rd}%</b><span>${T("tayyorlik")}</span></div>
   </div>
   <p class="hint">${T("Ko'rsatkich lenta qamrovi va test aniqligidan hisoblanadi. Taxminiy — rasmiy baho emas.")}</p>

   <div class="row4">
     <div class="st"><b>${S.xp}</b><span>XP</span></div>
     <div class="st"><b>${streak()}</b><span>${T("kun")}</span></div>
     <div class="st"><b>${acc===null?"—":Math.round(acc*100)+"%"}</b><span>${T("aniqlik")}</span></div>
     <div class="st"><b>${S.best}</b><span>${T("kombo")}</span></div>
   </div>

   <h3 class="ph">${T("Sozlamalar")}</h3>
   <button class="jm wide" onclick="flip()">${T("Yozuv")}: <b>${S.cyr?"Кирилл":"Lotin"}</b> &#8212; ${T("almashtirish")}</button>
   <h3 class="ph">${T("Imtihon sanasi")}</h3>
   <div class="exam">
     <input type="date" id="exd" value="${S.exam||''}" onchange="setExam(this.value)">
     ${dl!==null&&dl>=0?`<div class="dl"><b>${dl}</b><span>${T("kun qoldi")}</span></div>`:''}
   </div>
   ${pace}
   <div class="warn plain">${T(`Lentada yana ${rest} ta kartochka qoldi`)}</div>

   <h3 class="ph">${T("Imtihongacha yo'l")}</h3>
   <div class="map">${mapSVG()}</div>

   <h3 class="ph">${T("Bosqichlar")}</h3>
   <div class="stages">${st.map((x,i)=>{
     const f=clamp((S.pos-x.a)/Math.max(1,x.b-x.a),0,1),p=Math.round(f*100);
     return `<div class="sg ${f>=1?'done':(f>0?'now':'')}">
       <div class="sgh"><b>${i+1}. ${T(x.t)}</b><em>${p}%</em></div>
       <div class="sgs">${T(x.s)}</div>
       <div class="bar"><i style="width:${p}%"></i></div>
       <button class="jm" onclick="jump(${x.a})">${T(f>0?"Qaytadan o'tish":"Shu yerdan boshlash")}</button></div>`}).join('')}
   </div>

   <h3 class="ph">${T("Zaif joylar")}</h3>
   ${w.length?`<div class="weak">${w.map(([n,v])=>`<div class="wk"><span>${T(n)}</span><b>${v.w} ${T("xato")}</b></div>`).join('')}</div>`
     :`<p class="hint">${T("Hali yetarli ma'lumot yo'q. Bir necha sessiya o'tgach shu yerda eng ko'p xato qilgan mavzularing chiqadi.")}</p>`}

   <h3 class="ph">${T("Imtihon haqida")}</h3>
   <table class="tb">
     <tr><td>${T("Savollar")}</td><td>20</td></tr>
     <tr><td>${T("Vaqt")}</td><td>25 ${T("daq")}</td></tr>
     <tr><td>${T("O'tish bali")}</td><td>18</td></tr>
     <tr><td>${T("Ruxsat etilgan xato")}</td><td>2</td></tr>
     <tr><td>${T("Qayta topshirish")}</td><td>7 ${T("kun")}</td></tr>
   </table>
   <p class="hint">${T("Imtihondan bir hafta oldin rasmiy bazadan ham bilet ishla: 24pdd.uz, autotestlar.uz. Savol ta'riflari u yerda boshqacha yozilgan bo'lishi mumkin.")}</p>
   <button class="b b2" style="margin-top:20px" onclick="resetAll()">${T("Progressni tozalash")}</button>
   <div style="height:30px"></div>`;
}
</script>
</body>
</html>
