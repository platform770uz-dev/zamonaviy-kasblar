<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>YHQ Reels — 10 daqiqa</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 1924 uslubi: brend-feys / HR suhbat sahifalari bilan bir xil ranglar, shriftlar va fon */
:root{
  --bg:#F4ECDF; --card:#FFFDF8; --ink:#13181C; --muted:#6B6358; --line:#E4D8C4;
  --teal:#0B7F7B; --teal-soft:rgba(11,127,123,.10); --teal-deep:#08605D; --yellow:#FFD23F; --star:#D9A400;
  --clay:#B5543A; --clay-soft:rgba(181,84,58,.12); --on-teal:#FFFFFF;
  --frame:#141920; --shadow:0 1px 2px rgba(19,24,28,.05),0 10px 28px rgba(19,24,28,.07);
  --fd:"Unbounded",system-ui,sans-serif; --fb:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tx:var(--ink); --mu:var(--muted); --ln:var(--line); --p1:var(--card); --yel:var(--teal); --grn:var(--teal); --red:var(--clay);
  --tile:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2256%22%20height%3D%2256%22%20viewBox%3D%220%200%2056%2056%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22rgba%2811%2C127%2C123%2C0.09%29%22%20stroke-width%3D%221%22%3E%3Cpath%20d%3D%22M28%204%2038%2014%2028%2024%2018%2014z%22%2F%3E%3Cpath%20d%3D%22M28%2032%2038%2042%2028%2052%2018%2042z%22%2F%3E%3Cpath%20d%3D%22M4%2028%2014%2018%2024%2028%2014%2038z%22%2F%3E%3Cpath%20d%3D%22M32%2028%2042%2018%2052%2028%2042%2038z%22%2F%3E%3Cpath%20d%3D%22M28%2014%2042%2028%2028%2042%2014%2028z%22%2F%3E%3Ccircle%20cx%3D%2228%22%20cy%3D%2228%22%20r%3D%223%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  --band:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2264%22%20height%3D%2214%22%20viewBox%3D%220%200%2064%2014%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%230B7F7B%22%20stroke-width%3D%221.1%22%3E%3Cpath%20d%3D%22M0%207h64%22%2F%3E%3Cpath%20d%3D%22M8%201.5%2014.5%207%208%2012.5%201.5%207z%22%2F%3E%3Cpath%20d%3D%22M8%203.6%2012.4%207%208%2010.4%203.6%207z%22%2F%3E%3Cpath%20d%3D%22M40%201.5%2046.5%207%2040%2012.5%2033.5%207z%22%2F%3E%3Cpath%20d%3D%22M40%203.6%2044.4%207%2040%2010.4%2035.6%207z%22%2F%3E%3Cpath%20d%3D%22M22%202.6v8.8M26.4%207h-8.8M19.5%204.5l5%205M24.5%204.5l-5%205%22%2F%3E%3Cpath%20d%3D%22M54%202.6v8.8M58.4%207h-8.8M51.5%204.5l5%205M56.5%204.5l-5%205%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1014; --card:#161C21; --ink:#F1F4F6; --muted:#8C969D; --line:#263038;
    --teal:#2BB3AD; --teal-soft:rgba(43,179,173,.14); --teal-deep:#1E8A85; --star:#FFD23F;
    --clay:#E0896F; --clay-soft:rgba(224,137,111,.16); --on-teal:#06201F;
    --frame:#0F1418; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1014; --card:#161C21; --ink:#F1F4F6; --muted:#8C969D; --line:#263038;
  --teal:#2BB3AD; --teal-soft:rgba(43,179,173,.14); --teal-deep:#1E8A85; --star:#FFD23F;
  --clay:#E0896F; --clay-soft:rgba(224,137,111,.16); --on-teal:#06201F;
  --frame:#0F1418; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--bg) var(--tile);background-size:56px 56px;color:var(--ink);font:400 16px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fd);font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.15}
button{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ---- tepa panel ---- */
#top{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
#top::after{content:"";position:absolute;left:0;right:0;bottom:-15px;height:14px;background-image:var(--band);background-size:64px 14px;opacity:.55;pointer-events:none}
.tin{max-width:560px;margin:0 auto;height:52px;padding:0 14px;display:flex;align-items:center;gap:10px}
#tb{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;min-width:40px}
#tb i{display:block;height:100%;width:0;background:var(--teal);transition:width .35s ease;border-radius:3px}
#pct{font-weight:600;font-size:13px;color:var(--muted);min-width:34px;font-variant-numeric:tabular-nums}
.xpw{font:700 12.5px/1 var(--fd);color:var(--ink);white-space:nowrap}
.xpw em{font-style:normal;color:var(--teal);margin-left:4px}
.fin{font-weight:600;font-size:13.5px;border:1.5px solid var(--teal);color:var(--teal);border-radius:999px;padding:5px 13px;white-space:nowrap}
.fin:active{background:var(--teal);color:var(--on-teal)}
.tg{font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.pf{color:var(--muted);padding:2px;display:flex}.pf svg{width:22px;height:22px}
.pf:active{color:var(--ink)}

/* ---- lenta ---- */
#feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
.reel{height:100vh;height:100dvh;min-height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;
 display:flex;flex-direction:column;justify-content:center;padding:calc(80px + env(safe-area-inset-top,0px)) 16px calc(74px + env(safe-area-inset-bottom,0px));position:relative}
.in{max-width:520px;margin:0 auto;width:100%;max-height:100%;overflow-y:auto;scrollbar-width:none;
 background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px 22px;box-shadow:var(--shadow)}
.in::-webkit-scrollbar{display:none}
.tagline{font-size:11.5px;letter-spacing:.12em;color:var(--teal);margin-bottom:12px;font-weight:700}

/* bo'lim ajratgichi */
.chap{align-items:center;text-align:center}
.chap .in{padding:28px 20px 26px}
.chap .no{font:700 64px/.95 var(--fd);color:var(--teal);letter-spacing:-.02em}
.chap .no.ttl{font-size:clamp(24px,7.4vw,34px);line-height:1.1;margin-top:4px}
.chap h2{font-size:23px;margin:12px 0 8px}
.chap p{color:var(--muted);margin:0;font-size:15.5px}

/* fakt */
.hook{font:700 clamp(40px,13vw,72px)/.95 var(--fd);color:var(--teal);margin-bottom:4px;word-break:break-word;letter-spacing:-.02em}
.hook.sm{font-size:30px;line-height:1.1;color:var(--ink)}
.scene{margin:0 0 16px;border-radius:16px;background:var(--frame);padding:10px;overflow:hidden}
.scene svg{width:100%;height:auto;display:block;max-height:32vh}
.fact h2{font-size:21px;margin:14px 0 10px}
.fact p{font-size:16.5px;line-height:1.55;color:var(--ink);margin:0 0 12px}
.why{border-left:3px solid var(--teal);background:var(--teal-soft);border-radius:0 12px 12px 0;padding:10px 12px 10px 13px;font-size:15px;color:var(--ink);line-height:1.45}

/* belgi */
.sw{display:flex;justify-content:center;margin-bottom:18px}
.sw svg{width:min(44vw,180px);height:min(44vw,180px);display:block}
.sgroup{display:inline-block;font-size:11px;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);
 border-radius:999px;padding:3px 10px;margin-bottom:10px;font-weight:700}
.sname{font:700 21px/1.2 var(--fd);margin-bottom:10px}
.sdesc{font-size:16px;line-height:1.55;color:var(--ink)}

/* test */
.q{font-size:18.5px;font-weight:600;line-height:1.4;margin-bottom:18px}
.qs{display:flex;justify-content:center;margin-bottom:16px}
.qs svg{width:min(34vw,132px);height:min(34vw,132px)}
.o{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:9px;background:var(--bg);
 border:1.5px solid var(--line);border-radius:14px;line-height:1.35;font-size:16px;transition:border-color .15s,background .15s}
.o:active{border-color:var(--teal)}
.o.ok{border-color:var(--teal);background:var(--teal-soft);font-weight:600}
.o.no{border-color:var(--clay);background:var(--clay-soft)}
.o.dim{opacity:.45}
.ex{margin-top:14px;border-left:3px solid var(--teal);padding:10px 0 10px 13px;font-size:15.5px;line-height:1.45;color:var(--ink)}
.ex b{font:700 15px/1.3 var(--fd);display:block;margin-bottom:4px}
.ex b.g{color:var(--teal)}.ex b.r{color:var(--clay)}

/* pastki ishora */
.swipe{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;
 color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.06em;animation:up 1.9s ease-in-out infinite}
@keyframes up{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
.swipe.hide{display:none}

/* yakun */
.end{text-align:center;align-items:center}
.end .big{font:700 56px/1 var(--fd);color:var(--teal)}
.stats{display:flex;gap:8px;margin:20px 0 22px}
.st{flex:1;border:1px solid var(--line);border-radius:14px;padding:11px 4px;background:var(--bg)}
.st b{display:block;font:700 19px/1.2 var(--fd);color:var(--teal)}
.st span{font-size:11.5px;color:var(--muted)}
.b{display:block;width:100%;padding:14px;border-radius:14px;font:700 15px/1.2 var(--fd);text-align:center;
 background:var(--teal);color:var(--on-teal);box-shadow:0 4px 0 var(--teal-deep)}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-deep)}
.b2{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 0 var(--line);margin-top:10px}
.b2:active{box-shadow:0 1px 0 var(--line)}
.credit{font-size:11px;color:var(--muted);margin-top:20px;line-height:1.5}
.credit a{color:var(--muted)}
.reel .in{opacity:0;transform:translateY(18px);transition:opacity .45s ease,transform .45s ease}
.reel.vis .in{opacity:1;transform:none}
.xs{display:flex;justify-content:center;margin-bottom:12px;background:var(--frame);border-radius:16px;padding:8px}
.xs svg{width:min(74vw,290px);height:auto}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sopt{background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 8px;box-shadow:0 3px 0 var(--line)}
.sopt svg{width:84px;height:84px;display:block;margin:0 auto}
.sopt.ok{border-color:var(--teal);background:var(--teal-soft)}.sopt.no{border-color:var(--clay);background:var(--clay-soft)}.sopt.dim{opacity:.4}
.nx{display:block;margin-top:12px;padding:10px 16px;border-radius:12px;background:var(--teal);color:var(--on-teal);font:700 13.5px/1.3 var(--fd)}
.cb{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:var(--yellow);color:#13181C;font:600 12.5px/1.5 var(--fb);vertical-align:middle}
.toast{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;background:var(--yellow);color:#13181C;
 font:700 16px/1.3 var(--fd);padding:7px 16px;border-radius:999px;box-shadow:var(--shadow);animation:pop 1.1s ease forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.mile .in{border:2px solid var(--yellow)}
.mile .star{font-size:80px;color:var(--star);line-height:1;animation:spin 1.2s ease-out}
@keyframes spin{from{transform:rotate(-30deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.xpbig{display:inline-block;margin-top:14px;padding:6px 16px;border-radius:999px;background:var(--yellow);color:#13181C;font:700 22px/1.2 var(--fd)}
.teaser{font-size:15px;color:var(--muted);margin:0 0 18px}.teaser b{color:var(--ink)}

/* ---- profil ---- */
#prof{position:fixed;inset:0;z-index:70;background:var(--bg) var(--tile);background-size:56px 56px;display:none;flex-direction:column}
#prof.on{display:flex}
.ptop{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.ptop b{font:700 16px/1.2 var(--fd);flex:1;text-align:center}
.pbk{font-size:24px;color:var(--ink);line-height:1;width:28px;text-align:left}
.ptop span{width:28px}
.pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pin{max-width:560px;margin:0 auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom,0px))}
.ring{position:relative;width:150px;margin:6px auto 10px}
.ring svg{width:150px;height:150px;display:block}
.rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rv b{font:700 30px/1 var(--fd)}
.rv span{font-size:11.5px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin:8px 0 0;text-align:center}
.row4{display:flex;gap:8px;margin:18px 0 4px}
.row4 .st{flex:1;border:1px solid var(--line);border-radius:13px;padding:10px 4px;text-align:center;background:var(--card)}
.row4 .st b{display:block;font:700 17px/1.2 var(--fd);color:var(--teal)}
.row4 .st span{font-size:10.5px;color:var(--muted)}
.ph{font:700 15px/1.3 var(--fd);margin:26px 0 10px;color:var(--ink)}
.exam{display:flex;gap:10px;align-items:stretch}
.exam input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;color:var(--ink);
 font-family:inherit;font-size:16px;padding:13px 14px;-webkit-appearance:none}
.dl{border:1px solid var(--line);border-radius:13px;padding:8px 16px;text-align:center;min-width:86px;background:var(--card)}
.dl b{display:block;font:700 22px/1.2 var(--fd);color:var(--teal)}
.dl span{font-size:10.5px;color:var(--muted)}
.warn{margin-top:10px;font-size:13.5px;line-height:1.45;padding:11px 13px;border-radius:12px;border-left:3px solid var(--star);background:var(--card);color:var(--ink)}
.warn.ok{border-left-color:var(--teal)}.warn.bad{border-left-color:var(--clay)}
.warn.plain{border-left-color:var(--line);color:var(--muted)}
.map{background:var(--frame);border-radius:16px;padding:12px 6px}
.map svg{width:100%;height:auto;display:block}
.sg{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;background:var(--card)}
.sg.done{border-color:color-mix(in srgb,var(--teal) 45%,var(--line))}.sg.now{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.sgh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sgh b{font:700 14.5px/1.3 var(--fd)}
.sgh em{font-style:normal;font:700 14px/1.3 var(--fd);color:var(--teal)}
.sgs{font-size:12.5px;color:var(--muted);margin:3px 0 9px}
.sg .bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.sg .bar i{display:block;height:100%;background:var(--teal);border-radius:4px}
.jm.wide{display:block;width:100%;text-align:center;padding:12px;margin-top:0;font-size:14px;background:var(--card)}
.jm.wide b{color:var(--teal)}
.jm{margin-top:11px;font-size:13px;font-weight:600;color:var(--teal);border:1px solid var(--line);border-radius:999px;padding:6px 13px}
.weak .wk{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.weak .wk b{color:var(--clay);font:700 13.5px/1.3 var(--fd);white-space:nowrap}
.tb{width:100%;border-collapse:collapse;font-size:14.5px}
.tb td{padding:9px 2px;border-bottom:1px solid var(--line)}
.tb td:last-child{text-align:right;font:700 14px/1.3 var(--fd)}
@media (prefers-reduced-motion:reduce){.swipe{animation:none}#feed{scroll-behavior:auto}.reel .in{transition:none}}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Telegram Mini App: botdagi «Intizom» tugmasidan ochilganda — toʻliq ekran, pastga surganda yopilmaydi, Telegram mavzusi */
(function(){
  var w = window.Telegram && window.Telegram.WebApp;
  if(!w || !w.initData) return;
  try{
    document.documentElement.setAttribute("data-theme", w.colorScheme === "dark" ? "dark" : "light");
    w.ready(); w.expand();
    if(w.disableVerticalSwipes) w.disableVerticalSwipes();
    var cs = getComputedStyle(document.documentElement);
    if(w.setHeaderColor) w.setHeaderColor(cs.getPropertyValue("--card").trim());
    if(w.setBackgroundColor) w.setBackgroundColor(cs.getPropertyValue("--bg").trim());
  }catch(e){}
})();
</script>
</head>
<body>
<div id="top"><div class="tin">
  <div id="tb"><i></i></div><span id="pct">0%</span>
  <span class="xpw"><b id="xp">0</b> XP <em id="cmb"></em></span>
  <button class="fin" onclick="stopSession()" data-t>Yetarli</button>
  <button class="pf" onclick="openProf()" aria-label="Profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4 3.4-6.2 7.5-6.2s7.5 2.2 7.5 6.2"/></svg></button>
</div></div>
<div id="feed"></div>
<div id="prof">
  <div class="ptop"><button class="pbk" onclick="closeProf()">&#8592;</button><b data-t>Sening yo'ling</b><span></span></div>
  <div class="pbody"><div class="pin" id="profBody"></div></div>
</div>
<script>
const MODULES = {
  atama:    "Atamalar va umumiy qoidalar",
  ogoh:     "Ogohlantiruvchi belgilar",
  imtiyoz:  "Imtiyoz belgilari",
  taqiq:    "Taqiqlovchi belgilar",
  buyruq:   "Buyuruvchi va axborot belgilari",
  svet:     "Svetofor va tartibga soluvchi",
  chiziq:   "Yo'l chiziqlari",
  manyovr:  "Manyovr va ogohlantiruvchi ishoralar",
  tezlik:   "Harakatlanish tezligi",
  quvib:    "Quvib o'tish va qatorda joylashuv",
  toxtash:  "To'xtash va to'xtab turish",
  chorraha: "Chorrahalar",
  piyoda:   "Piyodalar, bekat, temir yo'l",
  magistral:"Avtomagistral va turar joy dahasi",
  yoritish: "Yoritish asboblari va shatak",
  tashish:  "Odam va yuk tashish",
  nosozlik: "Nosozliklar va hujjatlar",
  tibbiy:   "Birinchi tibbiy yordam"
};


const Q = [
/* --- atamalar --- */
{m:"atama",q:"Transport vositasi harakatini qancha vaqtga to'xtatish «to'xtash» deb ataladi?",o:["5 daqiqagacha","10 daqiqagacha","15 daqiqagacha"],a:1,e:"YHQ bo'yicha to'xtash — 10 daqiqagacha. Undan ko'pi to'xtab turish hisoblanadi."},
{m:"atama",q:"Yo'lovchi tushirish bilan bog'liq bo'lmagan holda harakatni 10 daqiqadan ko'proq to'xtatish nima deyiladi?",o:["To'xtash","To'xtab turish","Majburiy to'xtash"],a:1,e:"Yo'lovchi tushirish yoki yuk ortish bilan bog'liq to'xtatish vaqtdan qat'i nazar to'xtash hisoblanadi."},
{m:"atama",q:"«Yetarlicha ko'rinmaslik» qanday sharoitda yuzaga keladi?",o:["Ko'rinish masofasi 300 metrdan kam bo'lganda","Ko'rinish masofasi 150 metrdan kam bo'lganda","Faqat sutkaning qorong'i vaqtida"],a:0,e:"Yomg'ir, qor, tuman yoki g'ira-shirada yo'lning ko'rinish masofasi 300 metrdan kam bo'lishi."},
{m:"atama",q:"Hovlidan yo'lga chiqayotgan haydovchi nima qiladi?",o:["O'ng qo'l qoidasiga amal qiladi","Barcha yo'l harakati ishtirokchilariga yo'l beradi","Faqat piyodalarga yo'l beradi"],a:1,e:"Hovli — yondosh hudud. Undan chiqish joyi chorraha hisoblanmaydi, chiqayotgan hammaga yo'l beradi."},
{m:"atama",q:"Ikkinchi darajali yo'lning chorrahaga tutash qismi asfaltlangan bo'lsa, u asosiy yo'lga teng bo'ladimi?",o:["Ha, qoplama bir xil bo'lsa teng","Yo'q, u asosiy yo'lga teng bo'lmaydi","Faqat aholi punktida teng bo'ladi"],a:1,e:"Qoidalarda to'g'ridan-to'g'ri aytilgan: tutash qismning qoplamali bo'lishi uni teng huquqli qilmaydi."},
{m:"atama",q:"Tirbandlik tufayli oldingda to'xtab qolgan avtomobil to'siq hisoblanadimi?",o:["Ha, uni aylanib o'tish mumkin","Yo'q, u to'siq hisoblanmaydi","Faqat 10 daqiqadan ko'p tursa"],a:1,e:"Tirbandlik yoki Qoidalar talabi bilan to'xtagan transport vositasi to'siq emas — uni aylanib o'tish uchun asos yo'q."},
{m:"atama",q:"Dvigatel hajmi 50 sm³ va undan ortiq bo'lgan ikki g'ildirakli vosita qaysi toifaga kiradi?",o:["Moped","Mototsikl","Skuter"],a:1,e:"Mototsikl — hajmi 50 sm³ dan, konstruktiv tezligi 50 km/soatdan boshlanadi. Moped esa 25–50 sm³."},
{m:"atama",q:"Transport vositasini boshqarishni o'rgatayotgan instruktor kim hisoblanadi?",o:["Yo'lovchi","Haydovchi","Kuzatuvchi"],a:1,e:"O'rgatuvchi shaxs haydovchi hisoblanadi va javobgarlikni ham u ko'taradi."},
{m:"atama",q:"«Quvib o'tish» deganda nima tushuniladi?",o:["Har qanday oldinga o'tib ketish","Qarama-qarshi harakat tasmasiga chiqib o'zib ketish va qatorga qaytish","Yonidagi qatordan tezroq yurish"],a:1,e:"Qarama-qarshi tasmaga chiqmasdan o'zib ketish — bu «o'zib ketish», quvib o'tish emas."},
{m:"atama",q:"Yo'lning transport vositalari harakatlanishi uchun mo'ljallangan qismi qanday ataladi?",o:["Yo'l yoqasi","Qatnov qismi","Ajratuvchi mintaqa"],a:1,e:"Yo'l yoqasi qatnov qismiga tutash bo'lib, unda to'xtash va to'xtab turishga ruxsat etiladi."},

/* --- ogohlantiruvchi --- */
{m:"ogoh",q:"Ogohlantiruvchi belgilarning shakli qanday?",o:["Doira, qizil hoshiya","Uchburchak, qizil hoshiya","Ko'k to'rtburchak"],a:1,e:"Uchburchak + qizil hoshiya = ogohlantirish. Doira + qizil hoshiya = taqiq."},
{m:"ogoh",q:"Ogohlantiruvchi belgi nimani anglatadi?",o:["Harakatni taqiqlaydi","Oldinda xavfli joy borligidan xabardor qiladi","Imtiyoz beradi"],a:1,e:"Ogohlantiruvchi belgilar hech narsani taqiqlamaydi — ular faqat oldindan ogohlantiradi."},
{m:"ogoh",q:"Aholi punktlaridan tashqarida ogohlantiruvchi belgi xavfli joydan qancha oldin o'rnatiladi?",o:["50–100 metr","150–300 metr","300–500 metr"],a:1,e:"Aholi punktlarida esa 50–100 metr oldin o'rnatiladi — tezlik pastroq bo'lgani uchun."},
{m:"ogoh",q:"Uchburchak ichida yugurayotgan ikki bola tasviri tushirilgan belgi nimani bildiradi?",o:["Bolalar muassasasi yaqinligi haqida ogohlantiradi","Piyodalar o'tish joyi","Bolalarni tashish taqiqlanadi"],a:0,e:"«Bolalar» belgisi maktab, bog'cha yaqinidan ogohlantiradi; u piyodalar o'tish joyini belgilamaydi."},
{m:"ogoh",q:"Uchburchak ichidagi piyoda tasviri (ogohlantiruvchi) va ko'k kvadratdagi piyoda tasviri farqi nimada?",o:["Farqi yo'q","Uchburchakli — ogohlantiradi, ko'k kvadratli — o'tish joyining o'zini belgilaydi","Ko'k kvadratli faqat shaharda ishlatiladi"],a:1,e:"O'tish joyining chegarasi 5.16.1 va 5.16.2 ko'k belgilar bilan aniqlanadi."},
{m:"ogoh",q:"Shlagbaumsiz temir yo'l kesishmasi belgisida nima tasvirlangan?",o:["Panjara tasviri","Bug' lokomotivi tasviri","Qizil xoch"],a:1,e:"Shlagbaumli kesishmada panjara, shlagbaumsizida lokomotiv tasvirlanadi."},
{m:"ogoh",q:"«Boshqa xavf-xatarlar» belgisi qachon o'rnatiladi?",o:["Boshqa belgilar bilan ifodalanmagan xavf bo'lganda","Faqat yo'l ta'mirlanayotganda","Faqat aholi punktida"],a:0,e:"Bu universal ogohlantirish — ostidagi qo'shimcha lavhada xavf turi yozilishi mumkin."},

/* --- imtiyoz --- */
{m:"imtiyoz",q:"Qaysi belgi rombsimon (to'rtburchak, uchi yuqoriga) shaklda bo'ladi?",o:["Yo'l bering","Asosiy yo'l","Aylanma harakatlanish"],a:1,e:"«Asosiy yo'l» — YHQ dagi yagona sariq rombsimon belgi, shuning uchun uni adashtirib bo'lmaydi."},
{m:"imtiyoz",q:"«To'xtamasdan harakatlanish taqiqlanadi» (STOP) belgisida yo'l bo'sh bo'lsa nima qilinadi?",o:["Sekinlashtirib davom etiladi","Baribir to'xtash shart","Faqat piyoda bo'lsa to'xtaladi"],a:1,e:"To'xtash chizig'i oldida, u bo'lmasa kesishayotgan qatnov qismi chetida to'liq to'xtash shart."},
{m:"imtiyoz",q:"Uchi pastga qaragan uchburchak belgi nimani bildiradi?",o:["Yo'l bering","Asosiy yo'l","Kirish taqiqlanadi"],a:0,e:"«Yo'l bering» — to'xtash shart emas, lekin kesishayotgan yo'ldagilarga xalaqit bermasliging kerak."},
{m:"imtiyoz",q:"Chorrahada svetofor ishlayapti va yashil yonyapti, lekin «Yo'l bering» belgisi ham turibdi. Nima qilasan?",o:["To'xtab, yo'l berasan","Yurishni davom ettirasan","Signal berib o'tasan"],a:1,e:"Svetofor ishoralari imtiyoz belgilaridan ustun. Belgi faqat svetofor o'chganda ishlaydi."},
{m:"imtiyoz",q:"Tartibga soluvchining ishorasi svetofor ishorasiga zid bo'lsa, kimga bo'ysunasan?",o:["Svetoforga","Tartibga soluvchiga","Yo'l belgisiga"],a:1,e:"Ierarxiya: tartibga soluvchi → svetofor → imtiyoz belgilari → qolgan belgi va chiziqlar."},
{m:"imtiyoz",q:"«Asosiy yo'l tugashi» belgisidan keyin chorrahada nima o'zgaradi?",o:["Endi imtiyozga ega emassan, ustunlik boshqa qoidalar bilan aniqlanadi","Hech narsa o'zgarmaydi","To'xtash shart bo'ladi"],a:0,e:"Bu belgi ustunlikni tugatadi; keyingi chorrahada belgilar yoki o'ng qo'l qoidasi ishlaydi."},
{m:"imtiyoz",q:"Sariq rombsimon belgi ostida qora chiziqli oq lavha (yo'nalish sxemasi) turibdi. U nimani ko'rsatadi?",o:["Yo'lning kengligi","Asosiy yo'lning chorrahadagi yo'nalishi","Tezlik chegarasi"],a:1,e:"Asosiy yo'l chorrahada burilib ketsa, bu lavha uning yo'nalishini ko'rsatadi — o'ta muhim savol turi."},
{m:"imtiyoz",q:"Tor qismda qarama-qarshi harakat ustunligiga ega ekanligingni qaysi belgi bildiradi?",o:["Ko'k fonda oq va qizil strelkali belgi","Qizil hoshiyali doira, ichida qizil strelka pastga","Sariq romb"],a:0,e:"Ko'k fondagi belgi — sizda ustunlik; qizil hoshiyali belgi — qarama-qarshi transportga yo'l berasiz."},

/* --- taqiqlovchi --- */
{m:"taqiq",q:"Taqiqlovchi belgilar qanday shaklda bo'ladi?",o:["Uchburchak","Doira","Sakkiz burchak"],a:1,e:"Doira + qizil hoshiya (yoki qizil fon) = taqiq."},
{m:"taqiq",q:"«3.27 To'xtash taqiqlanadi» belgisi nimalarni taqiqlaydi?",o:["Faqat to'xtab turishni","To'xtashni ham, to'xtab turishni ham","Faqat yuk avtomobillari uchun to'xtashni"],a:1,e:"To'xtash taqiqlangan joyda to'xtab turish ham avtomatik taqiqlanadi — teskarisi emas."},
{m:"taqiq",q:"«3.28 To'xtab turish taqiqlanadi» belgisi ta'sirida yo'lovchini tushirish uchun qisqa to'xtash mumkinmi?",o:["Ha, mumkin","Yo'q, mumkin emas","Faqat kechasi mumkin"],a:0,e:"Bu belgi faqat 10 daqiqadan ortiq turishni taqiqlaydi, qisqa to'xtashga ruxsat."},
{m:"taqiq",q:"«Qayrilib olish taqiqlanadi» belgisi chapga burilishni ham taqiqlaydimi?",o:["Ha, taqiqlaydi","Yo'q, taqiqlamaydi","Faqat aholi punktida taqiqlaydi"],a:1,e:"U faqat 180 gradus burilishni taqiqlaydi. Chapga burilish ochiq qoladi."},
{m:"taqiq",q:"Qizil doira ichidagi oq gorizontal to'rtburchak («g'isht») nimani bildiradi?",o:["Harakatlanish taqiqlanadi","Kirish taqiqlanadi","Yuk avtomobillari uchun taqiq"],a:1,e:"«Kirish taqiqlanadi» — masalan, bir tomonlama yo'lga qarama-qarshi tomondan kirish."},
{m:"taqiq",q:"«Quvib o'tish taqiqlanadi» belgisining ta'siri qayerda tugaydi?",o:["Keyingi chorrahada yoki mos «tugadi» belgisida","500 metrdan keyin","Aholi punkti tugagach"],a:0,e:"Ko'pchilik taqiqlovchi belgilarning ta'siri keyingi chorrahagacha davom etadi."},
{m:"taqiq",q:"Doira ichida qizil raqam yozilgan belgi nimani bildiradi?",o:["Tavsiya etilgan tezlik","Eng katta ruxsat etilgan tezlikni cheklash","Eng kichik tezlik"],a:1,e:"Ko'k fondagi oq raqam esa eng kichik yoki tavsiya etilgan tezlikni bildiradi."},
{m:"taqiq",q:"Taqiqlovchi belgilar ta'siri yo'nalishli transport vositalariga tarqaladimi?",o:["Har doim tarqaladi","Ayrim belgilarda yo'nalishli transportga istisno beriladi","Hech qachon tarqalmaydi"],a:1,e:"Masalan, «Kirish taqiqlanadi» belgisi belgilangan yo'nalishdagi jamoat transportiga ta'sir qilmaydi."},
{m:"taqiq",q:"Belgi ta'sir doirasini uzaytiruvchi qo'shimcha lavha nima ko'rsatadi?",o:["Belgi qancha masofada amal qilishini","Belgi kim uchun ekanligini","Yo'lning nomini"],a:0,e:"Masalan «300 m» yozuvi belgi ta'siri shuncha masofada davom etishini bildiradi."},

/* --- buyruq / axborot --- */
{m:"buyruq",q:"Ko'k fonli doira shaklidagi belgi nima qiladi?",o:["Taqiqlaydi","Buyuradi — faqat ko'rsatilgan yo'nalishda harakatlanishga ruxsat beradi","Ogohlantiradi"],a:1,e:"Ko'k doira — buyuruvchi belgi. Uning ko'rsatmasidan chetga chiqib bo'lmaydi."},
{m:"buyruq",q:"Ko'k doira ichida uchta strelka doira bo'ylab aylanayotgan belgi nimani bildiradi?",o:["Qayrilib olish joyi","Aylanma harakatlanish","Burilish taqiqlanadi"],a:1,e:"Aylanma chorrahada harakat faqat ko'rsatilgan yo'nalishda bo'ladi."},
{m:"buyruq",q:"Oq fonli «Aholi punkti» belgisidan keyin qanday qoidalar amal qiladi?",o:["Aholi punkti uchun belgilangan qoidalar","Avvalgi qoidalar saqlanadi","Faqat tezlik o'zgaradi"],a:0,e:"Oq fon = aholi punkti qoidalari to'liq ishlaydi. Ko'k fonli o'xshash belgi esa faqat joy nomini bildiradi."},
{m:"buyruq",q:"Ko'k to'rtburchak ichida oq strelka yuqoriga qaragan belgi nimani bildiradi?",o:["To'g'riga harakatlanish buyuriladi","Bir tomonlama harakatlanuvchi yo'l","Avtomagistral"],a:1,e:"Bu axborot-ishorat belgisi: shu yo'lda qarama-qarshi harakat yo'q."},
{m:"buyruq",q:"Ko'k fonda oq avtomobil tasviri tushirilgan belgi (5.1) nimani bildiradi?",o:["Avtomagistral","Avtomobillar uchun mo'ljallangan yo'l","To'xtab turish joyi"],a:0,e:"Avtomagistralda maxsus qoidalar amal qiladi: orqaga yurish va qayrilib olish taqiqlanadi."},
{m:"buyruq",q:"Ko'k kvadrat ichida oq uchburchakda piyoda tasviri bo'lsa, bu nima?",o:["Piyodalar yo'lkasi","Piyodalar o'tish joyi","Piyodalar harakati taqiqlanadi"],a:1,e:"Piyodalar yo'lkasi esa ko'k doira ichida piyoda tasviri bilan beriladi."},
{m:"buyruq",q:"«Turar joy dahasi» belgisidan keyin eng katta tezlik qancha?",o:["20 km/soat","30 km/soat","40 km/soat"],a:0,e:"Turar joy dahasi va yondosh hududda tezlik 20 km/soatdan oshmasligi kerak, piyodalar ustun."},

/* --- svetofor va tartibga soluvchi --- */
{m:"svet",q:"Miltillovchi yashil ishora nimani bildiradi?",o:["Harakat taqiqlanadi","Harakatga ruxsat beradi va tez orada taqiqlovchi ishora yonishidan xabar beradi","Ehtiyot bo'lib o'tish mumkin"],a:1,e:"Yashil miltillayotgan bo'lsa, hali ruxsat — lekin tezlashish emas, to'xtashga tayyorlanish kerak."},
{m:"svet",q:"Miltillovchi sariq ishora nimani anglatadi?",o:["Harakat taqiqlanadi","Ehtiyotkorlik bilan harakatlanishga ruxsat, chorraha tartibga solinmagan","Yashil yonishini kut"],a:1,e:"Bunday chorrahada ustunlik imtiyoz belgilari yoki o'ng qo'l qoidasi bilan aniqlanadi."},
{m:"svet",q:"Qizil va sariq ishoralar bir vaqtda yonsa nima qilinadi?",o:["Harakatni boshlash mumkin","Harakat taqiqlanadi, yashil yonishi kutiladi","Faqat o'ngga burilish mumkin"],a:1,e:"Bu kombinatsiya hali taqiq, u faqat yashil yaqinlashayotganidan xabar beradi."},
{m:"svet",q:"Miltillovchi qizil ishora nimani bildiradi?",o:["Harakat taqiqlanadi","Ehtiyot bo'lib o'tish mumkin","Faqat jamoat transporti o'tadi"],a:0,e:"Qizil ham, miltillovchi qizil ham harakatni taqiqlaydi."},
{m:"svet",q:"Svetoforning qo'shimcha tarmog'idagi chiroq o'chgan bo'lsa, shu yo'nalishda harakatlanish mumkinmi?",o:["Ha, agar asosiy chiroq yashil bo'lsa","Yo'q, taqiqlanadi","Ehtiyot bo'lib mumkin"],a:1,e:"Qo'shimcha tarmoq o'chiq bo'lsa, u tartibga solayotgan yo'nalishda harakat taqiqlanadi."},
{m:"svet",q:"Reversiv svetofor o'chirilgan va tasma ikki tomondan 1.9 chizig'i bilan belgilangan. Nima qilasan?",o:["Bu tasmaga kirish taqiqlanadi","Ehtiyot bo'lib kirish mumkin","Faqat quvib o'tish uchun kirish mumkin"],a:0,e:"O'chirilgan reversiv svetofor shu tasmaga kirishni taqiqlaydi."},
{m:"svet",q:"Tartibga soluvchi qo'llarini yon tomonga uzatgan. Uning yon tomonidan turgan haydovchi qayerga yura oladi?",o:["Faqat to'g'riga","To'g'riga va o'ngga","Barcha yo'nalishlarda"],a:1,e:"Relssiz transport uchun — to'g'riga va o'ngga. Piyodalar ham qatnov qismini kesib o'tishi mumkin."},
{m:"svet",q:"Tartibga soluvchining ko'kragi yoki orqasi senga qaragan, qo'llari yon tomonda. Nima qilasan?",o:["To'g'riga yurasan","O'ngga burilasan","To'xtaysan — harakat taqiqlanadi"],a:2,e:"Old va orqa tomondan barcha transport vositalari va piyodalar uchun taqiq."},
{m:"svet",q:"Tartibga soluvchi o'ng qo'lini oldinga uzatdi. Uning old tomonida turgan haydovchi qayerga yura oladi?",o:["Faqat o'ngga","To'g'riga va o'ngga","Barcha yo'nalishlarda"],a:0,e:"Old tomondan — faqat o'ngga. Chap yonidan esa barcha yo'nalishlarda ruxsat."},
{m:"svet",q:"Tartibga soluvchi o'ng qo'lini oldinga uzatgan. Uning chap yonida turgan haydovchi uchun qanday ruxsat bor?",o:["Faqat o'ngga","Barcha yo'nalishlarda","Harakat taqiqlanadi"],a:1,e:"Chap yonidan relssiz transport barcha yo'nalishlarda harakatlana oladi."},
{m:"svet",q:"Tartibga soluvchi o'ng qo'lini oldinga uzatganda piyodalar qayerdan o'tishi mumkin?",o:["Tartibga soluvchining old tomonidan","Tartibga soluvchining orqa tomonidan","Umuman o'ta olmaydi"],a:1,e:"Bu holatda piyodalarga faqat tartibga soluvchining orqasidan o'tishga ruxsat etiladi."},
{m:"svet",q:"Tartibga soluvchi qo'lini yuqoriga ko'tardi. Bu nimani bildiradi?",o:["Faqat to'g'riga ruxsat","Barcha yo'nalishlarda harakat taqiqlanadi","Tezlikni oshirish mumkin"],a:1,e:"Yagona istisno — keskin tormozsiz to'xtay olmaydigan haydovchi harakatni davom ettiradi."},
{m:"svet",q:"Yashildan keyin sariq yondi, lekin keskin tormozsiz to'xtay olmaysan. Nima qilasan?",o:["Keskin tormoz berasan","Harakatni davom ettirasan","Orqaga yurasan"],a:1,e:"Qoidalar keskin tormozdan ko'ra harakatni davom ettirishni afzal ko'radi — keyingi avtomobil urib ketmasligi uchun."},
{m:"svet",q:"Chorrahadagi svetofor umuman ishlamayapti. Nima qilasan?",o:["Ko'ndalang yo'nalishdagi svetofor ham ishlamayotganiga ishonch hosil qilib, xavfsiz harakatlanasan","To'xtab, YPX xodimini kutasan","Har doim o'ng qo'l qoidasini qo'llaysan"],a:0,e:"Faqat bitta yo'nalishdagi svetofor o'chib qolgan bo'lishi mumkin — shuning uchun tekshirish shart."},
{m:"svet",q:"Temir yo'l kesishmasidagi oq rangli miltillovchi ishora nimani bildiradi?",o:["Harakat taqiqlanadi","Kesishma orqali harakatlanishga ruxsat beradi","Poyezd yaqinlashmoqda"],a:1,e:"Qizil miltillovchi ishora esa taqiqlaydi va unga tovushli ishora ham qo'shilishi mumkin."},
{m:"svet",q:"Taqiqlovchi ishorada to'xtash chizig'i yo'q bo'lsa, chorrahada qayerda to'xtaysan?",o:["Chorraha o'rtasida","Kesishayotgan qatnov qismi oldida, piyodalarga xalaqit bermay","Svetofordan 10 metr oldin"],a:1,e:"To'xtash chizig'i bo'lsa, avtomobilning eng oldingi nuqtasi chiziq ustiga chiqmasligi kerak."},

/* --- chiziqlar --- */
{m:"chiziq",q:"Uzunasiga tortilgan sidirg'a (uzluksiz) chiziq nimani bildiradi?",o:["Uni kesib o'tish taqiqlanadi","Ehtiyot bo'lib kesib o'tish mumkin","Faqat quvib o'tish uchun kesiladi"],a:0,e:"Qatnov qismining chetini belgilovchi chiziq bundan mustasno — unga to'xtash uchun yaqinlashish mumkin."},
{m:"chiziq",q:"Uzuq-uzuq bo'ylama chiziq nimani anglatadi?",o:["Uni kesib o'tish mumkin","Kesib o'tish taqiqlanadi","Faqat o'ngga qayta tizilish mumkin"],a:0,e:"Uzuq-uzuq chiziq qarama-qarshi oqimlarni yoki tasmalarni ajratadi, kesib o'tishga ruxsat."},
{m:"chiziq",q:"Qatnov qismida keng oq yo'llar («zebra») nimani belgilaydi?",o:["To'xtash joyini","Piyodalar o'tish joyini","Velosiped yo'lkasini"],a:1,e:"Chiziqlar bo'lmasa, o'tish joyi kengligi 5.16.1 va 5.16.2 belgilari orasidagi masofa bilan aniqlanadi."},
{m:"chiziq",q:"Yo'l chetiga tortilgan sariq sidirg'a chiziq nimani bildiradi?",o:["To'xtash taqiqlanadi","To'xtab turish taqiqlanadi","Yo'l yoqasi tugadi"],a:0,e:"Sariq uzuq-uzuq chiziq esa to'xtab turishni taqiqlaydi, qisqa to'xtashga ruxsat beradi."},
{m:"chiziq",q:"Yo'l chizig'i talabi yo'l belgisi talabiga zid bo'lsa, nimaga amal qilinadi?",o:["Yo'l chizig'iga","Yo'l belgisiga","Qaysi biri yangiroq bo'lsa"],a:1,e:"Belgi chiziqdan ustun turadi — chiziq ko'rinmay qolishi yoki eskirgan bo'lishi mumkin."},
{m:"chiziq",q:"Qatnov qismidagi ko'ndalang keng oq chiziq (to'xtash chizig'i) nimani ko'rsatadi?",o:["Taqiqlovchi ishorada to'xtash joyini","Piyodalar o'tish joyini","Tezlikni kamaytirish zarurligini"],a:0,e:"Avtomobilning eng oldingi nuqtasi bu chiziq ustiga chiqmasligi kerak."},

/* --- manyovr --- */
{m:"manyovr",q:"Burilish ishorasini berish senga imtiyoz beradimi?",o:["Ha, beradi","Yo'q, bermaydi va boshqalarga xavf tug'dirmaslikdan ozod qilmaydi","Faqat aholi punktida beradi"],a:1,e:"Ishora — bu ogohlantirish, ruxsatnoma emas. Manyovr xavfsiz bo'lishi shart."},
{m:"manyovr",q:"Chapga burilayotganda kimga yo'l berasan?",o:["Faqat piyodalarga","Qarama-qarshi to'g'riga va o'ngga ketayotgan transportga","Hech kimga"],a:1,e:"Qayrilib olishda ham xuddi shu qoida ishlaydi."},
{m:"manyovr",q:"Chorrahada orqaga yurish mumkinmi?",o:["Ha, ehtiyot bo'lib","Yo'q, taqiqlanadi","Faqat aholi punktidan tashqarida"],a:1,e:"Orqaga yurish chorrahalarda, o'tish joylarida, tunnellarda, ko'priklarda va temir yo'l kesishmalarida taqiqlanadi."},
{m:"manyovr",q:"Qayta tizilayotganda kimga yo'l berasan?",o:["Hech kimga","Yo'nalishini o'zgartirmay harakatlanayotgan transportga","Faqat o'ngdagilarga"],a:1,e:"Bir vaqtda qayta tizilayotgan bo'lsangiz — o'ngdagi ustun."},
{m:"manyovr",q:"Manyovr tugagach ogohlantiruvchi ishora nima qilinadi?",o:["Yonib turaveradi","Darhol o'chiriladi","Avariya ishorasiga o'tkaziladi"],a:1,e:"Yonib qolgan ishora boshqa haydovchilarni chalg'itadi va o'zi xavf manbai bo'ladi."},
{m:"manyovr",q:"Avariya (xavf-xatar) ishorasi qaysi holatda yoqiladi?",o:["Faqat YTH da","YTH, majburiy to'xtash, shatakka olinish va ko'zni qamashtirilganda","Faqat tunda to'xtaganda"],a:1,e:"Shuningdek, to'xtash taqiqlangan joyda majburan to'xtaganda ham yoqiladi."},
{m:"manyovr",q:"Harakatni boshlayotganda kimga yo'l berasan?",o:["Hech kimga","Harakatlanayotgan transport vositalari va piyodalarga","Faqat orqadagilarga"],a:1,e:"Joyidan qo'zg'alayotgan haydovchi hech qanday imtiyozga ega emas."},

/* --- tezlik --- */
{m:"tezlik",q:"Aholi punktlarida umumiy tezlik chegarasi qancha?",o:["60 km/soat","70 km/soat","80 km/soat"],a:1,e:"Toshkent, Nukus, viloyat va tuman markazlari hamda shaharlar hududida esa 60 km/soat."},
{m:"tezlik",q:"Toshkent shahri hududida tezlik chegarasi qancha?",o:["60 km/soat","70 km/soat","80 km/soat"],a:0,e:"Nukus, viloyat va tuman markazlari, shaharlar hududida ham 60 km/soat."},
{m:"tezlik",q:"Tegishli belgi o'rnatilgan maktab yoki bog'chaga yetmasdan va o'tib 300 metr masofada tezlik qancha?",o:["20 km/soat","30 km/soat","40 km/soat"],a:1,e:"Bu eng qat'iy shahar chegarasi — bolalar to'satdan yo'lga chiqishi mumkin."},
{m:"tezlik",q:"Turar joy dahasida va yondosh hududda tezlik qancha?",o:["20 km/soat","30 km/soat","40 km/soat"],a:0,e:"Bu joylarda piyodalar ustun va ular butun hudud bo'ylab yurishi mumkin."},
{m:"tezlik",q:"Aholi punktidan tashqarida yengil avtomobil uchun eng katta tezlik qancha?",o:["90 km/soat","100 km/soat","110 km/soat"],a:1,e:"Ruxsat etilgan to'liq vazni 3,5 tonnadan oshmaydigan yuk avtomobili uchun ham 100."},
{m:"tezlik",q:"Aholi punktidan tashqarida shaharlararo avtobus uchun tezlik qancha?",o:["80 km/soat","90 km/soat","100 km/soat"],a:1,e:"Boshqa avtobuslar uchun esa 80 km/soat."},
{m:"tezlik",q:"Aholi punktidan tashqarida mototsikl uchun eng katta tezlik qancha?",o:["70 km/soat","80 km/soat","90 km/soat"],a:1,e:"Xuddi shu 80 chegarasi tirkamali yengil avtomobil va 3,5 tonnadan og'ir yuk avtomobiliga ham tegishli."},
{m:"tezlik",q:"Mexanik transport vositasini shatakka olganda eng katta tezlik qancha?",o:["40 km/soat","50 km/soat","60 km/soat"],a:1,e:"Bu chegara har qanday yo'lda — aholi punktida ham, tashqarisida ham amal qiladi."},
{m:"tezlik",q:"Yukxonasida odam tashiyotgan yuk avtomobili uchun tezlik qancha?",o:["50 km/soat","60 km/soat","70 km/soat"],a:1,e:"Bolalar guruhini tashkiliy tashiyotgan transport uchun ham 60 km/soat."},
{m:"tezlik",q:"Quyidagilardan qaysi biri haydovchiga taqiqlanadi?",o:["Zaruratsiz keskin tormoz berish","Tezlikni kamaytirish","Xavf ko'rganda to'xtash"],a:0,e:"Shuningdek, zaruratsiz juda past tezlikda yurib boshqalarga xalaqit berish ham taqiqlanadi."},

/* --- quvib o'tish --- */
{m:"quvib",q:"Piyodalar o'tish joyida quvib o'tish mumkinmi?",o:["Ha, piyoda bo'lmasa","Yo'q, taqiqlanadi","Faqat sekin tezlikda"],a:1,e:"O'tish joyi eng xavfli nuqta — quvib o'tayotgan avtomobil piyodani ko'rmay qolishi mumkin."},
{m:"quvib",q:"Temir yo'l kesishmasiga necha metr qolganda quvib o'tish taqiqlanadi?",o:["50 metr","100 metr","150 metr"],a:1,e:"Kesishmaning o'zida ham quvib o'tish taqiqlanadi."},
{m:"quvib",q:"Oldindagi haydovchi chapga burilish ishorasini berdi. Uni quvib o'tish mumkinmi?",o:["Ha, chap tomondan","Yo'q, quvib o'tish taqiqlanadi","Ha, agar tez bo'lsa"],a:1,e:"Uni faqat o'ng tomondan o'zib ketish mumkin, agar bunga joy va shart-sharoit bo'lsa."},
{m:"quvib",q:"Tartibga solinmagan chorrahada kim quvib o'tishi mumkin?",o:["Hech kim","Asosiy yo'lda to'g'riga ketayotgan haydovchi","Chapga burilayotgan haydovchi"],a:1,e:"Boshqa barcha holatlarda tartibga solinmagan chorrahada quvib o'tish taqiqlanadi."},
{m:"quvib",q:"Ko'prik, estakada va tunnellarda quvib o'tish mumkinmi?",o:["Ha","Yo'q, taqiqlanadi","Faqat kunduzi"],a:1,e:"Ular ostida esa quvib o'tish taqiqlanmaydi — faqat ustida va ichida."},
{m:"quvib",q:"Aholi punktidan tashqarida haydovchi qaysi qatorda harakatlanishi kerak?",o:["Chetki chap qatorda","Imkon qadar o'ng tomonda","Markazda"],a:1,e:"Chap qator faqat quvib o'tish va chapga burilish uchun ishlatiladi."},

/* --- to'xtash --- */
{m:"toxtash",q:"Piyodalar o'tish joyiga necha metr qolganda to'xtash taqiqlanadi?",o:["5 metr","10 metr","15 metr"],a:1,e:"Velosiped yo'lkasi bilan kesishuvdan oldin ham 10 metr masofa saqlanadi."},
{m:"toxtash",q:"Qatnov qismlari kesishmasidan necha metr masofada to'xtash taqiqlanadi?",o:["10 metr","20 metr","30 metr"],a:2,e:"Uch tomonlama chorrahada yondan tutashgan yo'lning sidirg'a chiziq bilan ajratilgan qarama-qarshi tomoni bundan mustasno."},
{m:"toxtash",q:"Yo'nalishli transport bekatidan necha metr masofada to'xtash taqiqlanadi?",o:["10 metr","15 metr","20 metr"],a:1,e:"Yo'lovchi chiqarish yoki tushirish uchun to'xtash mumkin — jamoat transportiga xalaqit bermasa."},
{m:"toxtash",q:"Temir yo'l kesishmasining har ikki tomonidan necha metr masofada to'xtab turish taqiqlanadi?",o:["30 metr","50 metr","100 metr"],a:1,e:"Kesishmaning o'zida esa hatto qisqa to'xtash ham taqiqlanadi."},
{m:"toxtash",q:"To'xtagan avtomobil bilan sidirg'a chiziq orasida qancha masofa qolishi kerak?",o:["Kamida 3 metr","Kamida 2 metr","Kamida 5 metr"],a:0,e:"3 metrdan kam qolsa, boshqa transport o'ta olmaydi va to'xtash taqiqlanadi."},
{m:"toxtash",q:"Ko'rinish masofasi qancha bo'lgan do'nglik va xavfli burilishlarda to'xtash taqiqlanadi?",o:["100 metrdan kam","150 metrdan kam","200 metrdan kam"],a:0,e:"Orqadan kelayotgan haydovchi seni ko'rishga ulgurmaydi."},
{m:"toxtash",q:"Aholi punktida qaysi yo'lda chap tomonga to'xtash mumkin?",o:["Har qanday yo'lda","Har yo'nalishda bittadan tasmasi bo'lgan va tramvay yo'li yo'q yo'lda","Faqat avtomagistralda"],a:1,e:"Bir tomonlama harakatli yo'llarda ham chap tomonga to'xtashga ruxsat."},
{m:"toxtash",q:"Aholi punktidan tashqarida tunab qolish uchun qayerda to'xtab turish mumkin?",o:["Yo'l yoqasida","Faqat maxsus maydonchalarda yoki yo'ldan tashqarida","Qatnov qismi chetida"],a:1,e:"Bu qoida to'g'ridan-to'g'ri xavfsizlik uchun kiritilgan."},
{m:"toxtash",q:"Transport vositasining eshigini ochish qachon taqiqlanadi?",o:["Hech qachon","Agar boshqa harakat ishtirokchilariga xalaqit bersa yoki xavf tug'dirsa","Faqat kechasi"],a:1,e:"Ochilgan eshik velosipedchi yoki motosikl uchun jiddiy xavf."},

/* --- chorrahalar --- */
{m:"chorraha",q:"Tartibga solinmagan chorrahada yo'llar teng bo'lsa, kim ustun?",o:["Chapdan kelayotgan","O'ngdan kelayotgan","Tezroq kelayotgan"],a:1,e:"«O'ng qo'l qoidasi» — teng sharoitda ustunlikni aniqlashning asosiy vositasi."},
{m:"chorraha",q:"Asosiy yo'l chorrahada yo'nalishini o'zgartirsa, asosiy yo'ldagi haydovchilar o'zaro qanday o'tadi?",o:["O'ng qo'l qoidasi bo'yicha","Kim tez kelsa","Chapdagi ustun"],a:0,e:"Ikkinchi darajali yo'ldagilar ham o'zaro shu qoidani qo'llaydi."},
{m:"chorraha",q:"Chorrahadan keyin tirbandlik bor va sen unda qolib ketishing mumkin. Yashil chiroqda nima qilasan?",o:["Chorrahaga kirmaysan","Kirasan, keyin joy topiladi","Signal berasan"],a:0,e:"Chorrahani to'sib qo'yish ko'ndalang yo'nalishni butunlay bloklaydi."},
{m:"chorraha",q:"Yashil chiroqda o'ngga burilyapsan, o'tish joyida piyoda bor. Nima qilasan?",o:["Piyodaga yo'l berasan","Signal berib o'tasan","Piyoda kutishi kerak"],a:0,e:"Yashil chiroq boshqa yo'nalishlar uchun ruxsat beradi, lekin piyodadan ustunlik bermaydi."},
{m:"chorraha",q:"Tramvay va relssiz transport teng sharoitda uchrashsa, kim ustun?",o:["Relssiz transport","Tramvay","O'ngdagi"],a:1,e:"Tramvay teng sharoitda har doim ustun, yo'nalishidan qat'i nazar — imtiyoz belgilari boshqacha ko'rsatmasa."},
{m:"chorraha",q:"Chorrahada chapga burilyapsan, qarama-qarshidan to'g'riga transport kelmoqda. Kim birinchi o'tadi?",o:["Sen","Qarama-qarshi transport","Kim tez bo'lsa"],a:1,e:"To'g'riga va o'ngga ketayotganlar chapga burilayotgandan ustun."},
{m:"chorraha",q:"Chorrahaga kirganingdan keyin svetofor qizilga o'zgardi. Nima qilasan?",o:["To'xtaysan","Belgilangan yo'nalish bo'yicha chorrahani tark etasan","Orqaga yurasan"],a:1,e:"Chorraha ichida to'xtash ko'ndalang oqim uchun to'siq yaratadi."},
{m:"chorraha",q:"Aylanma harakatlanish chorrahasida ustunlik qanday aniqlanadi?",o:["Har doim aylanadagilar ustun","O'rnatilgan imtiyoz belgilari bo'yicha","Har doim kirayotganlar ustun"],a:1,e:"Belgi bo'lmasa umumiy qoidalar ishlaydi, shuning uchun kirishda belgiga qarash shart."},
{m:"chorraha",q:"Trolleybus va avtobus bekatdan chiqmoqda (aholi punktida). Nima qilasan?",o:["Yo'l berasan","Tezlikni oshirasan","Signal berasan"],a:0,e:"Aholi punktlarida bekatdan chiqayotgan yo'nalishli transportga yo'l berish shart."},
{m:"chorraha",q:"«Yo'l bering» belgisi ostidagi lavhada asosiy yo'l o'ngga burilib ketgani ko'rsatilgan. Kimga yo'l berasan?",o:["Faqat chapdan kelayotganga","Asosiy yo'l bo'ylab harakatlanayotgan barcha transportga","Hech kimga"],a:1,e:"Asosiy yo'lning shakli o'zgargani sening ikkinchi darajali ekanligingni o'zgartirmaydi."},

/* --- piyodalar / temir yo'l --- */
{m:"piyoda",q:"Yoningdagi tasmada avtomobil piyodalar o'tish joyi oldida to'xtadi. Nima qilasan?",o:["Aylanib o'tasan","To'xtaysan va o'tayotgan piyoda yo'qligiga ishonch hosil qilasan","Sekinlashtirib o'tasan"],a:1,e:"To'xtagan avtomobil orqasidan chiqayotgan piyodani ko'rish deyarli imkonsiz."},
{m:"piyoda",q:"Qo'lida oq hassa ko'targan piyoda yo'lni kesib o'tmoqchi. Nima qilasan?",o:["Yo'l berasan","Signal berasan","Tez o'tib ketasan"],a:0,e:"Oq hassa — ko'r piyodaning belgisi; unga har qanday joyda yo'l beriladi."},
{m:"piyoda",q:"Bolalar guruhi yo'lni kesib o'tmoqda. Nima qilasan?",o:["Yo'l berasan","Signal berasan","Aylanib o'tasan"],a:0,e:"Bolalar guruhini tashish va o'tkazish alohida ehtiyotkorlikni talab qiladi."},
{m:"piyoda",q:"Shlagbaum tushmoqda, lekin poyezd hali ko'rinmayapti. Nima qilasan?",o:["Tez o'tib olasan","To'xtaysan — kesishmaga kirish taqiqlanadi","Sekin o'tasan"],a:1,e:"Shlagbaum yopilayotgan bo'lsa yoki qizil chiroq miltillayotgan bo'lsa, harakat taqiqlanadi."},
{m:"piyoda",q:"Avtomobiling temir yo'l kesishmasida to'xtab qoldi. Birinchi navbatda nima qilasan?",o:["Dvigatelni ta'mirlaysan","Odamlarni tushirib, kesishmani bo'shatish choralarini ko'rasan","Tez yordamni chaqirasan"],a:1,e:"Iloji bo'lmasa, ikki tomonga odam yuborib, poyezdga to'xtash ishorasini berish kerak."},
{m:"piyoda",q:"Temir yo'l kesishmasida nima taqiqlanadi?",o:["Faqat orqaga yurish","To'xtash, quvib o'tish va orqaga yurish","Faqat quvib o'tish"],a:1,e:"Kesishma to'liq va tez bo'shatilishi kerak bo'lgan hudud."},
{m:"piyoda",q:"Piyodalar o'tish joyida orqaga yurish mumkinmi?",o:["Ha","Yo'q, taqiqlanadi","Faqat piyoda bo'lmasa"],a:1,e:"Orqaga yurish o'tish joylari, chorrahalar, tunnellar va ko'priklarda taqiqlanadi."},

/* --- avtomagistral / turar joy --- */
{m:"magistral",q:"Avtomagistralda nima taqiqlanadi?",o:["Quvib o'tish","Orqaga yurish va qayrilib olish","Chap qatorda yurish"],a:1,e:"Ajratuvchi mintaqadan o'tish va texnologik teshiklardan foydalanish ham taqiqlanadi."},
{m:"magistral",q:"Tezligi 40 km/soatdan oshmaydigan transport avtomagistralga chiqa oladimi?",o:["Ha","Yo'q","Faqat kunduzi"],a:1,e:"Sekin transport avtomagistralda jiddiy xavf yaratadi."},
{m:"magistral",q:"Turar joy dahasida kim ustun?",o:["Transport vositalari","Piyodalar","Velosipedchilar"],a:1,e:"Piyodalar butun hudud bo'ylab yurishi mumkin, lekin ular ham asossiz to'siq yaratmasligi kerak."},
{m:"magistral",q:"Turar joy dahasidan chiqayotganda nima qilasan?",o:["O'ng qo'l qoidasini qo'llaysan","Barcha harakat ishtirokchilariga yo'l berasan","Signal berasan"],a:1,e:"Xuddi yondosh hududdan chiqishdagi kabi."},
{m:"magistral",q:"Turar joy dahasida nima taqiqlanadi?",o:["Dvigateli ishlab turgan holda to'xtab turish","Piyoda yurish","20 km/soat tezlikda yurish"],a:0,e:"Shuningdek, o'quv haydash va yuk avtomobillarining to'xtab turishi ham cheklanadi."},

/* --- yoritish va shatak --- */
{m:"yoritish",q:"Sutkaning qorong'i vaqtida harakatlanayotganda qaysi chiroqlar yoqilishi kerak?",o:["Faqat gabarit chiroqlar","Yaqinni yoki uzoqni yorituvchi chiroqlar","Avariya ishorasi"],a:1,e:"Faqat gabarit chiroq bilan yurish taqiqlanadi — u yo'lni yoritmaydi."},
{m:"yoritish",q:"Qarama-qarshi transportga necha metr qolganda uzoqni yorituvchi chiroqni yaqinga o'tkazish kerak?",o:["100 metr","150 metr","200 metr"],a:1,e:"Agar haydovchi ko'zi qamashganini ishora qilsa, undan oldinroq ham o'tkazish kerak."},
{m:"yoritish",q:"Tunnelda kunduzi chiroq yoqiladimi?",o:["Yo'q","Ha, yoqiladi","Faqat uzun tunnellarda"],a:1,e:"Yorug'likdan qorong'ilikka o'tishda ko'z darhol moslasha olmaydi."},
{m:"yoritish",q:"Egiluvchan ulanish moslamasida shatakka olishda transport vositalari orasidagi masofa qancha bo'ladi?",o:["2–3 metr","4–6 metr","8–10 metr"],a:1,e:"Qattiq ulanishda esa masofa 4 metrdan oshmasligi kerak."},
{m:"yoritish",q:"Egiluvchan moslamada shatakka olinayotgan avtomobilda odam bo'lishi mumkinmi?",o:["Faqat haydovchi bo'lishi mumkin","Hech kim bo'lmasligi kerak","Istalgancha yo'lovchi bo'lishi mumkin"],a:0,e:"Shatakka oluvchi avtomobil yukxonasida esa odam tashish taqiqlanadi."},
{m:"yoritish",q:"Shatakka olinayotgan avtomobilda qaysi ishora yoqiladi?",o:["Avariya (xavf-xatar) ishorasi","Faqat gabarit chiroqlar","Uzoqni yorituvchi chiroq"],a:0,e:"Avariya ishorasi ishlamasa, orqasiga ogohlantiruvchi uchburchak mahkamlanadi."},

/* --- odam va yuk tashish --- */
{m:"tashish",q:"Xavfsizlik kamari bilan jihozlangan avtomobilda kim kamar taqishi shart?",o:["Faqat haydovchi","Haydovchi va barcha yo'lovchilar","Faqat old o'rindiqdagilar"],a:1,e:"Kamar YTH da eng ko'p hayot saqlab qolgan oddiy vosita."},
{m:"tashish",q:"Yuk avtomobili yukxonasida odam tashishga qachon ruxsat etiladi?",o:["Hech qachon","Yukxona odam tashish uchun jihozlangan bo'lsa va talablar bajarilsa","Faqat qisqa masofaga"],a:1,e:"Bunday holatda tezlik 60 km/soatdan oshmasligi kerak."},
{m:"tashish",q:"Yuk transport vositasining orqasidan qancha chiqib tursa, u belgilanishi kerak?",o:["0,5 metrdan ortiq","1 metrdan ortiq","2 metrdan ortiq"],a:1,e:"Yon tomondan 0,4 metrdan ortiq chiqsa ham belgilash talab etiladi."},
{m:"tashish",q:"Yuk haydovchining ko'rinishini to'sib qo'ysa nima qilinadi?",o:["Sekin yuriladi","Bunday yuk bilan harakatlanish taqiqlanadi","Yordamchi olinadi"],a:1,e:"Shuningdek, yuk ustuvorlikni buzsa yoki chiroqlarni to'ssa ham harakat taqiqlanadi."},
{m:"tashish",q:"Mototsiklda yo'lovchi tashishda nima talab qilinadi?",o:["Kaska taqish","Faqat kunduzi tashish","Yo'lovchi 18 yoshdan katta bo'lishi"],a:0,e:"Haydovchi ham, yo'lovchi ham mahkamlangan kaskada bo'lishi shart."},

/* --- nosozliklar / hujjatlar --- */
{m:"nosozlik",q:"Qaysi nosozlikda harakatlanish butunlay taqiqlanadi?",o:["Spidometr ishlamasa","Tormoz tizimi ishlamasa","Radio ishlamasa"],a:1,e:"Tormoz va rul boshqaruvi — hech qanday chegirma bo'lmaydigan ikki tizim."},
{m:"nosozlik",q:"Yomg'ir yog'ayotganda haydovchi tomondagi shisha tozalagich ishlamasa nima bo'ladi?",o:["Sekin yurish mumkin","Harakatlanish taqiqlanadi","Avariya ishorasi bilan yurish mumkin"],a:1,e:"Ko'rinish yo'qolgan haydovchi to'liq nazoratni yo'qotadi."},
{m:"nosozlik",q:"Sutkaning qorong'i vaqtida old chiroqlar ishlamasa nima qilinadi?",o:["Harakatlanish taqiqlanadi","Gabarit chiroq bilan yuriladi","Avariya ishorasi yoqiladi"],a:0,e:"Nosozlik yo'lda paydo bo'lsa, ehtiyot choralari bilan to'xtash joyiga yoki ustaxonaga borish mumkin."},
{m:"nosozlik",q:"Haydovchi yonida bo'lishi shart bo'lgan hujjat qaysi?",o:["Sug'urta polisi","Tug'ilganlik haqidagi guvohnoma","Kafolat kitobchasi"],a:0,e:"Haydovchilik guvohnomasi va ro'yxatga olish hujjati ham majburiy."},
{m:"nosozlik",q:"Spirtli ichimlik ta'sirida transport vositasini boshqarish mumkinmi?",o:["Kam miqdorda mumkin","Taqiqlanadi","Faqat aholi punktidan tashqarida"],a:1,e:"Shuningdek, mast holdagi shaxsga boshqarishni topshirish ham taqiqlanadi."},
{m:"nosozlik",q:"Haydovchi charchagan yoki kasal holatda boshqarishi mumkinmi?",o:["Ha","Yo'q, taqiqlanadi","Faqat qisqa masofaga"],a:1,e:"Reaksiya tezligiga ta'sir qiluvchi dori qabul qilganda ham boshqarish taqiqlanadi."},

/* --- tibbiy --- */
{m:"tibbiy",q:"Arterial qon oqishida jgut qayerga qo'yiladi?",o:["Yaraning pastiga","Yaradan yuqoriga","Bevosita yaraning ustiga"],a:1,e:"Jgut qo'yilgan vaqt yozib, jabrlanuvchi bilan birga qoldiriladi."},
{m:"tibbiy",q:"Jgut qo'yilgandan keyin nima qilish shart?",o:["Uni kiyim ostiga yashirish","Qo'yilgan sana, soat va daqiqani yozib, jgut ostiga ko'rinadigan qilib qistirish","Jgutni har 5 daqiqada yechish"],a:1,e:"Vaqt yozilmasa, keyingi shifokor jgut qachon qo'yilganini bilmaydi. Uzoq turib qolgan jgut oyoq-qo'lni butunlay nobud qilishi mumkin."},
{m:"tibbiy",q:"Hushidan ketgan jabrlanuvchida birinchi navbatda nima tekshiriladi?",o:["Harorati","Nafas yo'lining ochiqligi va nafas olishi","Qon bosimi"],a:1,e:"Boshni yon tomonga burib qo'yish qusuq bilan bo'g'ilib qolishning oldini oladi."},
{m:"tibbiy",q:"Umurtqa pog'onasi shikastlangan deb gumon qilinsa nima qilinadi?",o:["Tezda o'tirgan holatga o'tkaziladi","Keraksiz qimirlatilmaydi, qattiq yuzada qimirlamas holatda saqlanadi","Yon tomonga ag'dariladi"],a:1,e:"Noto'g'ri ko'chirish orqa miya shikastini kuchaytirishi mumkin."},
{m:"tibbiy",q:"Kuygan joyga nima qilish mumkin emas?",o:["Sovuq suv bilan sovutish","Moy yoki yog' surtish","Toza salfetka bilan yopish"],a:1,e:"Moy issiqlikni ushlab qoladi va infeksiya xavfini oshiradi."},
{m:"tibbiy",q:"YTH sodir bo'lganda haydovchi birinchi navbatda nima qiladi?",o:["Guvohlarni topadi","To'xtaydi, transportni joyidan qimirlatmaydi, avariya ishorasini yoqadi va ogohlantiruvchi uchburchak qo'yadi","Sug'urta kompaniyasiga qo'ng'iroq qiladi"],a:1,e:"Keyin jabrlanuvchilarga yordam ko'rsatiladi, tez yordam va IIO ga xabar beriladi."}
,
{m:"manyovr",q:"Aholi punktida majburiy to'xtaganda ogohlantiruvchi uchburchak transport vositasidan qancha masofada o'rnatiladi?",o:["Kamida 15 metr","Kamida 30 metr","Kamida 50 metr"],a:0,e:"Aholi yashamaydigan joylarda esa kamida 30 metr — u yerda tezlik yuqori, haydovchiga ko'proq vaqt kerak."},
{m:"manyovr",q:"Aholi punktidan tashqarida majburiy to'xtaganda ogohlantiruvchi uchburchak qancha masofada qo'yiladi?",o:["15 metr","30 metr","100 metr"],a:1,e:"Belgi haydovchilarni o'z vaqtida ogohlantira oladigan masofada turishi kerak."},
{m:"quvib",q:"«Quvib o'tish taqiqlangan» belgisi ta'sirida qanday transportni quvib o'tish mumkin?",o:["Hech qanday transportni","Soatiga 40 km dan sekin harakatlanayotgan transportni","Faqat velosipedni"],a:1,e:"Sekin yurayotgan transport orqasida butun oqim to'planib qolmasligi uchun shu istisno berilgan."},
{m:"taqiq",q:"«Chapga burilish taqiqlanadi» belgisi qayrilib olishni ham taqiqlaydimi?",o:["Ha, taqiqlaydi","Yo'q, taqiqlamaydi","Faqat aholi punktida taqiqlaydi"],a:1,e:"U faqat chapga burilishni taqiqlaydi. Aksincha, «Qayrilish taqiqlangan» belgisi chapga burilishga xalaqit bermaydi."},
{m:"taqiq",q:"«Kirish taqiqlangan» belgisining ta'siri kimga tarqalmaydi?",o:["Yuk avtomobillariga","Belgilangan yo'nalish bo'ylab yuruvchi jamoat transportiga","Mototsikllarga"],a:1,e:"Shuning uchun bir tomonlama ko'chaga avtobus qarama-qarshi kirib kelayotganini ko'rish mumkin."},
{m:"chorraha",q:"Tik ko'tarilish va nishablikda ikki transport uchrashib qoldi, o'tish uchun joy tor. Kim yo'l beradi?",o:["Pastga tushayotgan","Yuqoriga ko'tarilayotgan","O'ngdagi"],a:0,e:"Ko'tarilayotgan transportni joyidan qo'zg'atish qiyin, shuning uchun ustunlik unda."},
{m:"toxtash",q:"To'xtash taqiqlangan joyda majburan to'xtab qolding. Nima qilasan?",o:["Avariya ishorasini yoqib, transportni chetga olib chiqish va olib ketish choralarini ko'rasan","Shu yerda qolaverasan","Faqat signal berasan"],a:0,e:"Ogohlantiruvchi uchburchak ham qo'yiladi: aholi punktida 15, tashqarisida 30 metr masofada."}
];

const FACT=[
/* ===== 1-BOB: UMUMIY QOIDALAR VA ATAMALAR ===== */
{c:1,h:"10",t:"Bitta soniya atamani o'zgartiradi",v:"toxtash",p:"Harakatni 10 daqiqagacha to'xtatish — bu <b>to'xtash</b>. 10 daqiqadan ko'p tursang — bu allaqachon <b>to'xtab turish</b>.",w:"«To'xtash taqiqlangan» va «To'xtab turish taqiqlangan» — ikki xil belgi. Farqni bilmasang, qaysi biri ostida turganingni ham bilmaysan."},
{c:1,h:"300 m",t:"Ko'rinish qachon «yetarli emas»",p:"Yomg'ir, qor, tuman yoki g'ira-shirada yo'lning ko'rinish masofasi 300 metrdan kam bo'lsa — bu <b>yetarlicha ko'rinmaslik</b>.",w:"Shu daqiqadan boshlab chiroq yoqish majburiy bo'ladi va tezlik me'yorlari boshqacha ishlaydi."},
{c:1,h:"0",t:"Hovlidan chiqayotganda imtiyozing nolga teng",v:"yondosh",p:"Hovli, mahalla, to'xtab turish joyi, YOQSH — bular <b>yondosh hudud</b>. Ulardan chiqish joyi chorraha hisoblanmaydi.",w:"Demak o'ng qo'l qoidasi ishlamaydi: sen barcha yo'l harakati ishtirokchilariga yo'l berasan. Hech kimga emas — hammaga."},
{c:1,t:"Asfalt asosiy yo'l qilmaydi",h:"Asfalt ≠ asosiy",p:"Ikkinchi darajali yo'lning chorrahaga tutash qismi asfaltlangan bo'lishi mumkin. Qoidalarda to'g'ridan-to'g'ri yozilgan: bu uni asosiy yo'lga teng qilmaydi.",w:"Imtihonda aynan shu bilan chalg'itishadi: rasmda ikkala yo'l ham qora, lekin belgi boshqa narsa deydi."},
{c:1,h:"50",t:"Moped qayerda tugaydi, mototsikl qayerda boshlanadi",p:"Moped — dvigatel hajmi 25–50 sm³. Mototsikl — 50 sm³ va undan ortiq, tezligi 50 km/soatdan boshlanadi.",w:"Belgilar ular uchun turlicha ishlaydi, javobgarlik ham har xil."},
{c:1,t:"Tirbandlikdagi mashina to'siq emas",h:"To'siq?",p:"To'siq — bu yo'lda harakatsiz turgan jism: buzilgan avtomobil, tushib qolgan yuk, yiqilgan daraxt. Tirbandlik tufayli to'xtagan mashina to'siq hisoblanmaydi.",w:"Ya'ni uni aylanib o'tish uchun qonuniy asos yo'q — sidirg'a chiziqni kesib o'tsang, bu qoidabuzarlik."},

/* ===== 2-BOB: YO'L BELGILARI ===== */
{c:2,t:"Shakl ma'noni aytadi, rasm esa tafsilotni",v:"shakl",h:"△ ◯ ▭",p:"Uchburchak qizil hoshiya — ogohlantiradi, hech narsani taqiqlamaydi. Doira qizil hoshiya — taqiqlaydi. Ko'k doira — buyuradi. Ko'k to'rtburchak — xabar beradi.",w:"Belgini tanimasang ham shaklidan ma'nosini taxmin qilasan. Testda savollarning yarmi shu bilan yechiladi."},
{c:2,h:"1 ta",t:"YHQ dagi yagona romb",p:"«Asosiy yo'l» — qoidalardagi yagona rombsimon belgi. Boshqa hech qaysi belgi bu shaklda emas.",w:"Shuning uchun uni 100 metrdan, o'qimasdan tanib olasan. Bu tasodif emas — atayin shunday qilingan."},
{c:2,h:"8",t:"Va yagona sakkiz burchak",p:"«To'xtamasdan harakatlanish taqiqlangan» — yagona sakkiz burchakli belgi. Qor bosib qolsa ham, orqa tomonidan ham shaklidan tanib olinadi.",w:"Bu yerda to'xtash majburiy — yo'l bo'm-bo'sh bo'lsa ham. «Yo'l bering» belgisida esa to'xtash shart emas."},
{c:2,t:"Kulrang degani — bekor qilingan",h:"Kulrang",p:"«Oxiri» ma'nosidagi barcha belgilar kulrang bo'ladi: tezlik cheklovining oxiri, quvib o'tish taqiqining oxiri, barcha cheklovlarning oxiri.",w:"Rangni bilsang, raqamni yodlash shart emas: kulrang ko'rdingmi — cheklov tugagan."},
{c:2,h:"2 : 1",t:"Ikkita chiziq — ikkita taqiq",p:"«To'xtash taqiqlangan» belgisida ikkita kesishgan chiziq — to'xtash ham, to'xtab turish ham mumkin emas. «To'xtab turish taqiqlangan»da bitta chiziq — bitta taqiq.",w:"Bitta chiziqli belgi ostida 10 daqiqagacha to'xtashga ruxsat. Ikkita chiziqli ostida — umuman yo'q."},
{c:2,t:"Qayrilish va chapga burilish — boshqa-boshqa narsa",h:"↰ ≠ ↩",p:"«Qayrilish taqiqlangan» belgisi faqat 180° burilishni taqiqlaydi, chapga burilishga xalaqit bermaydi. «Chapga burilish taqiqlanadi» esa aksincha: chapga burila olmaysan, lekin qayrilib olishing mumkin.",w:"Imtihonda bu juftlik doimiy uchraydi va aynan shu yerda ko'p xato qilinadi."},
{c:2,h:"40",t:"Quvib o'tish taqiqining ichidagi istisno",p:"«Quvib o'tish taqiqlangan» belgisi ostida ham soatiga 40 km dan sekin harakatlanayotgan transportni quvib o'tish mumkin.",w:"Aks holda traktor orqasida butun oqim to'planib qolardi. Qoidada mantiq bor — yodlash emas, tushunish kerak."},
{c:2,t:"«G'isht» avtobusni to'xtatolmaydi",h:"Istisno",p:"«Kirish taqiqlangan» belgisining ta'siri belgilangan yo'nalish bo'ylab yuruvchi jamoat transportiga tarqalmaydi.",w:"Shuning uchun bir tomonlama ko'chada qarshingdan avtobus chiqib kelishi mumkin — bu qoidabuzarlik emas."},
{c:2,t:"Ogohlantiruvchi belgi qancha oldin turadi",h:"150–300",p:"Aholi punktidan tashqarida xavfli joydan 150–300 metr oldin. Aholi punkti ichida — 50–100 metr.",w:"Farq tezlikda: shaharda sekinroq yurasan, demak kamroq masofa yetadi."},

/* ===== 3-BOB: SVETOFOR, TARTIBGA SOLUVCHI, ISHORALAR ===== */
{c:3,t:"Kim kimdan kuchli",h:"1→2→3",p:"Tartibga soluvchi → svetofor → imtiyoz belgilari → boshqa belgilar → yo'l chiziqlari. Yuqoridagisi pastdagisini bekor qiladi.",w:"Yashil chiroq yonganda ostidagi «Yo'l bering» belgisiga qaramaysan. Tartibga soluvchi qo'l ko'tarsa — yashil chiroq ham to'xtatadi."},
{c:3,t:"Yelka ko'rinsa — yur",v:"tartib_yon",h:"Yelka",p:"Tartibga soluvchining qo'llari yon tomonda yoki tushirilgan: chap va o'ng yonidan to'g'riga va o'ngga ruxsat. Old va orqa tomondan — hamma uchun taqiq.",w:"Yelkasi senga qaragan bo'lsa — yur. Ko'kragi yoki orqasi qaragan bo'lsa — tur. Bitta jumla bilan yodda qoladi."},
{c:3,t:"O'ng qo'l oldinga — uchta javob birdan",v:"tartib_ong",h:"→",p:"Chap yonidan barcha yo'nalishlarda ruxsat. Old tomonidan faqat o'ngga. O'ng yonidan va orqadan — taqiq. Piyodalar tartibga soluvchining orqasidan o'tadi.",w:"Bu eng ko'p xato qilinadigan savol turi. Uchta pozitsiyani alohida-alohida yodlash kerak."},
{c:3,t:"Sariq chiroqda to'xtash har doim ham shart emas",v:"tartib_tepa",h:"42-band",p:"Sariq ishora harakatni taqiqlaydi. Lekin keskin tormozsiz to'xtay olmaydigan haydovchiga davom etishga ruxsat beriladi.",w:"Qoidalar keskin tormozdan ko'ra harakatni davom ettirishni afzal ko'radi — orqangdagi mashina urib ketmasligi uchun."},
{c:3,t:"O'chgan chiroq ham ishora",h:"O'chiq",p:"Qo'shimcha tarmoqdagi chiroq o'chiq bo'lsa — u tomonga harakat taqiqlanadi. O'chirilgan reversiv svetofor esa shu tasmaga kirishni taqiqlaydi.",w:"«Yonmayapti, demak mumkin» — eng qimmatga tushadigan xato."},
{c:3,t:"Ishora bering, lekin unga ishonmang",h:"Ishora",p:"Burilish ishorasini berish shart. Ammo ishora senga imtiyoz bermaydi va boshqalarga xavf tug'dirmaslikdan ozod qilmaydi.",w:"Ishora — bu ogohlantirish, ruxsatnoma emas. Manyovr tugagach uni darhol o'chirasan."},
{c:3,h:"15 / 30",t:"Ogohlantiruvchi uchburchak qayerga qo'yiladi",v:"uchburchak",p:"Majburiy to'xtaganda uchburchak avtomobildan aholi punktida kamida 15 metr, aholi punktidan tashqarida kamida 30 metr masofada qo'yiladi.",w:"Tashqarida tezlik yuqori — haydovchiga ko'proq vaqt kerak. Shuning uchun masofa ikki barobar."},

/* ===== 4-BOB: HARAKAT TARTIBI, TEZLIK, CHORRAHALAR ===== */
{c:4,h:"70",t:"Aholi punktidagi asosiy raqam",v:"tezlik",p:"Umumiy chegara — 70 km/soat. Lekin Toshkent, Nukus, viloyat va tuman markazlari hamda shaharlar hududida — 60.",w:"Ya'ni Farg'onada ham, Toshkentda ham 60. 70 raqami ko'proq kichik aholi punktlariga tegishli."},
{c:4,h:"30",t:"Maktab oldidagi eng qat'iy chegara",p:"Tegishli belgi o'rnatilgan maktab va bog'chaga yetmasdan va o'tib ketib 300 metr masofada tezlik 30 km/soatdan oshmasligi kerak.",w:"Bu shahardagi eng past chegara. Bola yo'lga to'satdan chiqadi — 30 da to'xtaysan, 60 da yo'q."},
{c:4,h:"100",t:"Aholi punktidan tashqarida",v:"tashqari",p:"Yengil avtomobil va 3,5 tonnagacha yuk avtomobili — 100. Shaharlararo avtobus — 90. Mototsikl, og'ir yuk, tirkamali yengil avtomobil — 80. Tirkamali yuk avtomobili — 70.",w:"Tirkama ulading — tezliging pasayadi. Qoida oddiy: og'irroq va uzunroq bo'lgani sekinroq yuradi."},
{c:4,h:"50",t:"Shatakka olding — tezliging 50",p:"Mexanik transport vositasini shatakka olgan transport har qanday yo'lda 50 km/soatdan tez yura olmaydi.",w:"Magistralda ham 50. Yo'l turi bu chegarani o'zgartirmaydi."},
{c:4,t:"O'ng qo'l qoidasi qachon ishlaydi",v:"ongqol",h:"→ ustun",p:"Tartibga solinmagan chorrahada yo'llar teng bo'lsa — o'ngdan kelayotganga yo'l berasan.",w:"Muhimi: bu faqat yo'llar TENG bo'lganda ishlaydi. Belgi bo'lsa, avval belgiga qaraysan."},
{c:4,t:"Asosiy yo'l burilib ketsa",v:"asosiy",h:"Ilmoq",p:"Asosiy yo'l chorrahada yo'nalishini o'zgartirsa, asosiy yo'ldagilar o'zaro o'ng qo'l qoidasi bo'yicha o'tadi. Ikkinchi darajalidagilar ham xuddi shunday.",w:"Ya'ni ustunlik ikki bosqichda hal qilinadi: avval qaysi yo'ldasan, keyin o'ng qo'l."},
{c:4,t:"Yashil chiroq piyodadan ustunlik bermaydi",h:"Yashil",p:"Yashil chiroqda burilayotganda o'tish joyidagi piyodalarga va velosipedchilarga yo'l berasan.",w:"Yashil chiroq boshqa yo'nalishlarga nisbatan ruxsat beradi — piyodaga nisbatan emas."},
{c:4,t:"Chorrahani to'sib qo'yma",h:"Kirma",p:"Chorrahadan keyin tirbandlik bo'lsa va sen unda qolib ketishing mumkin bo'lsa — yashil chiroqda ham chorrahaga kirma.",w:"Chorrahada qolib qolgan bitta mashina butun ko'ndalang yo'nalishni bloklaydi."},
{c:4,t:"Quvib o'tish qayerda mumkin emas",v:"quvib",h:"5 joy",p:"Tartibga solinmagan chorrahalarda, piyodalar o'tish joylarida, temir yo'l kesishmasi va unga 100 metr qolganda, ko'prik va tunnellarda, xavfli burilish va do'ngliklarda.",w:"Bitta istisno bor: asosiy yo'lda to'g'riga ketayotgan haydovchi tartibga solinmagan chorrahada quvib o'tishi mumkin."},

/* ===== 4-BOB: TO'XTASH ===== */
{c:4,h:"10 · 15 · 30",t:"To'xtash taqiqlangan uchta masofa",v:"masofa",p:"Piyodalar o'tish joyidan oldin 10 metr. Bekatdan 15 metr. Qatnov qismlari kesishmasidan 30 metr.",w:"Uchta raqam, uchta joy. Testda ular aynan shu ko'rinishda so'raladi — chalkashtirsang, javob xato."},
{c:4,h:"3",t:"Uch metr qoidasi",p:"To'xtagan avtomobil bilan sidirg'a chiziq, ajratuvchi mintaqa yoki qatnov qismining qarama-qarshi cheti orasida 3 metrdan kam qolsa — to'xtash taqiqlanadi.",w:"3 metr — bu bitta mashina o'tishi uchun kerak bo'lgan eng kam kenglik."},
{c:4,h:"50",t:"Temir yo'lda ikki xil taqiq",p:"Kesishmaning o'zida hatto qisqa to'xtash ham taqiqlanadi. To'xtab turish esa har ikki tomondan 50 metr masofada taqiqlanadi.",w:"To'xtash va to'xtab turish uchun masofalar boshqa-boshqa — bu tez-tez so'raladi."},
{c:4,h:"100",t:"Do'nglik ortidan seni ko'rmaydi",p:"Ko'rinish masofasi 100 metrdan kam bo'lgan do'ngliklar yaqinida va xavfli burilishlarda to'xtash taqiqlanadi.",w:"Orqadan kelayotgan haydovchi seni do'nglikdan chiqqanda ko'radi — tormozlashga vaqti qolmaydi."},

/* ===== 5-BOB: MURAKKAB SHAROITLAR ===== */
{c:5,t:"Magistralda nimalar taqiqlanadi",h:"3 ta taqiq",p:"Orqaga yurish, qayrilib olish va ajratuvchi mintaqadan o'tish. Shuningdek tezligi 40 km/soatdan oshmaydigan transport magistralga chiqa olmaydi.",w:"O'quv haydash ham taqiqlanadi. Magistral — xato uchun joy qolmaydigan yo'l."},
{c:5,h:"20",t:"Turar joy dahasida piyoda ustun",p:"Tezlik 20 km/soat, piyodalar butun hudud bo'ylab yurishi mumkin. Chiqayotganda esa barcha harakat ishtirokchilariga yo'l berasan.",w:"Bu yerda mashina emas, odam asosiy. Qoida ataylab shunday tuzilgan."},
{c:5,h:"150",t:"Ko'zni qamashtirmaslik masofasi",v:"farlar",p:"Qarama-qarshi transportga 150 metr qolganda uzoqni yorituvchi chiroqni yaqinga o'tkazasan. Haydovchi ishora bersa — undan oldinroq.",w:"Qamashgan ko'z 3–5 soniya ko'rmaydi. 90 km/soatda bu 100 metrdan ortiq ko'r yo'l."},
{c:5,h:"4–6",t:"Shatak arqoni qancha uzunlikda bo'ladi",v:"shatak",p:"Egiluvchan ulanishda transport vositalari orasidagi masofa 4–6 metr. Qattiq ulanishda — 4 metrdan oshmasligi kerak.",w:"Egiluvchan shatakda tortilayotgan mashinada faqat haydovchi bo'ladi, yo'lovchi bo'lmaydi."},

/* ===== 6-BOB: NOSOZLIKLAR VA HUJJATLAR ===== */
{c:6,t:"Harakat butunlay taqiqlanadigan nosozliklar",h:"4 ta",p:"Ishlamaydigan tormoz tizimi. Nosoz rul boshqaruvi. Ishlamaydigan ulanish moslamasi. Yomg'ir yoki qorda haydovchi tomondagi shisha tozalagichning ishlamasligi.",w:"Bu ro'yxatda chegirma yo'q. Qolgan nosozliklar bilan ehtiyot chorasini ko'rib ustaxonagacha borish mumkin."},
{c:6,t:"Yoningda bo'lishi shart bo'lgan hujjatlar",h:"3+1",p:"Haydovchilik guvohnomasi, transport vositasining ro'yxatga olish hujjati, majburiy sug'urta polisi. Kerak bo'lganda — yo'l varaqasi va yukka doir hujjatlar.",w:"Bittasi yo'q bo'lsa ham, harakatlanish huquqi shubha ostida qoladi."},

/* ===== 10-BOB: BIRINCHI TIBBIY YORDAM ===== */
{c:10,t:"YTH joyida birinchi uchta harakat",v:"yth",h:"1·2·3",p:"To'xtaysan va transportni joyidan qimirlatmaysan. Avariya ishorasini yoqib, ogohlantiruvchi uchburchak qo'yasan. Keyin jabrlanuvchilarga yordam ko'rsatib, tez yordam va IIO ga xabar berasan.",w:"Tartib muhim: avval joyni xavfsiz qilasan, keyin yordam berasan. Aks holda ikkinchi YTH sodir bo'ladi."},
{c:10,t:"Jgut yaradan yuqoriga qo'yiladi",h:"↑ yara",p:"Arterial qon oqishida jgut yaradan yuqoriga, terini siqib qo'ymaslik uchun kiyim yoki yumshoq bint ustidan bog'lanadi.",w:"Qo'yilgan sana, soat va daqiqa yozilib, qog'oz jgut ostiga ko'rinadigan qilib qistiriladi — keyingi shifokor uchun bu hayotiy ma'lumot."},
{c:10,t:"Nima qilmaslik kerak",h:"Qilma",p:"Kuygan joyga moy surmaysan. Singan suyakni o'zing to'g'rilamaysan. Umurtqa shikastlangan bo'lsa jabrlanuvchini keraksiz qimirlatmaysan. Hushsiz odamga suv yoki dori bermaysan.",w:"Noto'g'ri yordam ko'pincha yordamsizlikdan ko'ra ko'proq zarar keltiradi."},
{c:2,v:"chiziq",h:"— · —",t:"Chiziq turini shakli aytadi",p:"Sidirg'a (uzluksiz) chiziqni kesib o'tish taqiqlanadi. Uzuq-uzuq chiziqni kesish mumkin. Zebra — piyodalar o'tish joyi.",w:"Yagona istisno: qatnov qismining chetini belgilovchi sidirg'a chiziq — unga to'xtash uchun yaqinlashish mumkin."},
{c:2,h:"Belgi > chiziq",t:"Bahsda belgi yutadi",p:"Yo'l chizig'ining talabi yo'l belgisining talabiga zid bo'lsa, belgiga amal qilinadi.",w:"Chiziq eskirgan, qor bosgan yoki ta'mirdan keyin noto'g'ri tortilgan bo'lishi mumkin. Belgi esa turibdi."},
{c:2,h:"Sariq",t:"Sariq chiziq — to'xtash haqida",p:"Yo'l chetidagi sariq sidirg'a chiziq to'xtashni taqiqlaydi. Sariq uzuq-uzuq chiziq esa faqat to'xtab turishni taqiqlaydi.",w:"Bu yerda ham mantiq bir xil: sidirg'a — qattiqroq taqiq, uzuq — yumshoqroq."}
];

{m:"maxsus",q:"Ko'k mayoqchasi va tovushli ishorasi yoqilgan avtomobil yaqinlashmoqda. Nima qilasan?",o:["Tezlikni oshirib undan uzoqlashasan","Yo'l berasan, zarur bo'lsa to'xtaysan","Faqat aholi punktidan tashqarida yo'l berasan"],a:1,e:"Mayoqcha va tovushli ishora birga yoqilganda maxsus transport imtiyozga ega. Lekin uning haydovchisi ham xavfsizlikka ishonch hosil qilgandan keyingina imtiyozdan foydalanadi."},
{m:"maxsus",q:"Oldida mayoqchali avtomobil kuzatib borayotgan uch va undan ortiq mashinadan iborat tashkiliy jamlanma o'tmoqda. Nima taqiqlanadi?",o:["Unga qarab signal berish","Uni kesib o'tish yoki unga qo'shilib olish","Uni orqadan kuzatib borish"],a:1,e:"Tashkiliy jamlanma — yaqinni yorituvchi chiroqlarini yoqib, bir qatorda kelayotgan guruh. Uni kesib o'tish ham, ichiga kirib olish ham taqiq."},
{m:"maxsus",q:"Ko'k mayoqchasi yoqilgan, lekin tovushli ishorasi o'chiq avtomobil imtiyozga egami?",o:["Ha, har doim","Yo'q — imtiyoz uchun mayoqcha va tovushli ishora birga bo'lishi kerak","Faqat kechasi"],a:1,e:"Faqat mayoqcha — bu ogohlantirish. Imtiyoz mayoqcha bilan tovushli ishora birgalikda yoqilganda paydo bo'ladi."},
{m:"maxsus",q:"Maxsus transport haydovchisi imtiyozdan foydalanayotganda nimaga majbur?",o:["Hech narsaga — u hamma qoidadan ozod","Boshqa harakat ishtirokchilari unga yo'l berayotganiga ishonch hosil qilishga","Faqat tezlikni cheklashga"],a:1,e:"Imtiyoz avariya qilish huquqini bermaydi. Xavfsizlikka ishonch — avval, keyin o'tish."},

/* piyodalar va yo'lovchilar */
{m:"piyoda",q:"Trotuar ham, piyodalar yo'lkasi ham bo'lmasa, piyoda qayerdan yurishi kerak?",o:["Qatnov qismining o'rtasidan","Yo'l yoqasidan","Istagan joyidan"],a:1,e:"Yo'l yoqasi ham bo'lmasa — qatnov qismining chetidan, bir qator bo'lib."},
{m:"piyoda",q:"Aholi punktidan tashqarida yo'l yoqasida ketayotgan piyoda qaysi tomonga qarab yurishi kerak?",o:["Transport harakati yo'nalishida","Transport harakatiga qarshi yo'nalishda","Farqi yo'q"],a:1,e:"Qarshi yurganda kelayotgan mashinani ko'rasan va chetga chiqishga ulgurasan. Orqangdan kelganini esa eshitmasliging mumkin."},
{m:"piyoda",q:"Yo'lovchi harakatlanayotgan transport vositasining eshigini ochishi mumkinmi?",o:["Ha, ehtiyot bo'lib","Yo'q — faqat to'liq to'xtagandan keyin","Faqat orqa eshikni"],a:1,e:"Yo'lovchi chiqayotganda boshqa harakat ishtirokchilariga xalaqit bermasligi ham kerak — masalan, velosipedchiga."},
{m:"piyoda",q:"Sutkaning qorong'i vaqtida aholi punktidan tashqarida yo'l yoqasida ketayotgan piyodaga nima tavsiya etiladi?",o:["Qora kiyim kiyish","Yorug'lik qaytaruvchi element taqish","Yo'lning o'rtasidan yurish"],a:1,e:"Yorug'lik qaytargich piyodani 30–40 metrdan emas, 150 metrdan ko'rinadigan qiladi."},
{m:"piyoda",q:"Temir yo'l kesishmasi oldida to'xtash chizig'i ham, belgi ham, svetofor ham yo'q. Qayerda to'xtaysan?",o:["Shlagbaumdan 5 m, u bo'lmasa eng yaqin relsdan 10 m masofada","Relsdan 2 metr masofada","Shlagbaum tagida"],a:0,e:"Tartib: to'xtash chizig'i → 2.5 belgisi → svetofor → shlagbaumdan 5 m → relsdan 10 m."},
{m:"piyoda",q:"Kesishmadan keyin tirbandlik bor, sen relslar ustida qolib ketishing mumkin. Nima qilasan?",o:["Tez o'tib olasan","Kesishmaga kirmaysan","Signal berib o'tasan"],a:1,e:"Relslar ustida qolib ketgan mashina — eng og'ir YTH sababi. Poyezd tormoz yo'li kilometrlarda o'lchanadi."},

/* velosiped va moped */
{m:"velo",q:"Velosipedchi yo'lning qatnov qismida qanday harakatlanishi kerak?",o:["Istalgan qatorda","Faqat bir qator bo'lib, imkon qadar o'ng tomonda","Chetki chap qatorda"],a:1,e:"Velosiped yo'lkasi bo'lsa — faqat u yerda. Qatnov qismida esa bir qator, o'ngda."},
{m:"velo",q:"Velosipedchiga nima taqiqlanadi?",o:["Kaska taqish","Rulni qo'lda ushlamay yurish va boshqa transportga osilib olish","Signal berish"],a:1,e:"Shuningdek, yo'lovchi tashish (jihozlangan o'rindiqdan tashqari) va qatorda yonma-yon yurish ham taqiqlanadi."},
{m:"velo",q:"Velosipedchi chapga burilishi yoki qayrilib olishi mumkinmi?",o:["Har qanday yo'lda mumkin","Faqat bir yo'nalishda bitta tasmali va tramvay yo'li bo'lmagan yo'llarda","Hech qachon"],a:1,e:"Ko'p tasmali yo'lda velosipedchi piyoda kabi — velosipedni yetaklab — kesib o'tadi."},
{m:"velo",q:"Moped haydovchisi uchun nima majburiy?",o:["Kaska taqish","Qo'lqop taqish","Ko'zoynak taqish"],a:0,e:"Moped mexanik transport vositasi — unga mototsikl talablarining bir qismi tegishli."},

/* texnik holat */
{m:"texnik",q:"Yengil avtomobil shinasi protektorining qoldiq balandligi qanchadan kam bo'lsa harakatlanish taqiqlanadi?",o:["1,6 mm","2,0 mm","1,0 mm"],a:0,e:"Yuk avtomobili uchun 1 mm, avtobus uchun 2 mm, mototsikl uchun 0,8 mm."},
{m:"texnik",q:"Avtobus shinasi protektorining eng kam qoldiq balandligi qancha?",o:["1,0 mm","1,6 mm","2,0 mm"],a:2,e:"Avtobus odam tashiydi — talab eng qattiq."},
{m:"texnik",q:"Yengil avtomobil rul boshqaruvining yig'indi lyufti qanchadan oshsa foydalanish taqiqlanadi?",o:["10 gradus","20 gradus","25 gradus"],a:0,e:"Yuk avtomobili uchun 25, avtobus uchun 20 gradus."},
{m:"texnik",q:"Bir o'qda har xil o'lchamli yoki har xil turdagi shinalar o'rnatilgan. Foydalanish mumkinmi?",o:["Ha","Yo'q, taqiqlanadi","Faqat qishda"],a:1,e:"Har xil shina tormozlashda mashinani yon tomonga tortadi."},
{m:"texnik",q:"Ishlamayotgan tovushli ishora bilan harakatlanish mumkinmi?",o:["Ha, aholi punktida","Yo'q, taqiqlanadi","Faqat kunduzi"],a:1,e:"Tovushli ishora — YTH oldini olish vositasi, u ishlashi shart."},
{m:"texnik",q:"Chiqindi gazlar tarkibi me'yordan oshgan bo'lsa nima bo'ladi?",o:["Hech narsa","Foydalanish taqiqlanadi","Faqat shaharda taqiqlanadi"],a:1,e:"Bu foydalanishni taqiqlovchi shartlar ro'yxatiga kiradi."},

/* birinchi tibbiy yordam — qo'shimcha */
{m:"tibbiy",q:"Arterial qon oqishini qanday taniysan?",o:["To'q qizil qon bir tekis oqadi","Och qizil qon pulsatsiya bilan otilib chiqadi","Qon sekin sizadi"],a:1,e:"Arterial qon — yorqin, favvora kabi. Venoz — to'q, bir tekis. Kapillyar — sizadi."},
{m:"tibbiy",q:"Venoz qon oqishida nima qilinadi?",o:["Jgut qo'yiladi","Bosuvchi bog'lam qo'yiladi, oyoq-qo'l ko'tariladi","Yara yuviladi"],a:1,e:"Venoz oqishda jgut kerak emas — bosuvchi bog'lam yetadi."},
{m:"tibbiy",q:"Yurak-o'pka reanimatsiyasida bosim va nafasning nisbati qanday?",o:["15 : 2","30 : 2","5 : 1"],a:1,e:"30 marta ko'krak qafasiga bosim, 2 marta sun'iy nafas. Bosim chastotasi — daqiqasiga 100–120."},
{m:"tibbiy",q:"Ko'krak qafasiga bosim qanday chastotada beriladi?",o:["Daqiqasiga 60–80","Daqiqasiga 100–120","Daqiqasiga 140–160"],a:1,e:"Bosim chuqurligi — 5–6 sm. Qo'llar to'sh suyagining pastki uchdan birida."},
{m:"tibbiy",q:"Suyak singanda shina qanday qo'yiladi?",o:["Faqat singan joyga","Singan joyning ikki tomonidagi bo'g'imlarni qamrab","Faqat bitta bo'g'imni qamrab"],a:1,e:"Ikkita qo'shni bo'g'im qimirlamasa, singan suyak ham qimirlamaydi."},
{m:"tibbiy",q:"Ochiq sinishda birinchi navbatda nima qilinadi?",o:["Shina qo'yiladi","Qon oqishi to'xtatiladi","Suyak joyiga solinadi"],a:1,e:"Avval qon to'xtatiladi, keyin yara yopiladi, undan keyingina shina."},
{m:"tibbiy",q:"Bosh miya chayqalishining belgilari qaysilar?",o:["Ko'ngil aynishi, bosh og'rig'i, qisqa hushdan ketish","Faqat ko'z qizarishi","Faqat yo'tal"],a:0,e:"Jabrlanuvchi yotqiziladi, boshi salgina ko'tariladi, tez yordam chaqiriladi."},
{m:"tibbiy",q:"Travmatik shok holatidagi jabrlanuvchiga nima qilinadi?",o:["Sovuq suv quyiladi","Issiq o'rab, tinchlantiriladi, hushida bo'lsa iliq ichimlik beriladi","Yurishga majburlanadi"],a:1,e:"Qorin shikastlangan bo'lsa ichimlik berilmaydi."},
{m:"tibbiy",q:"Hushsiz, lekin nafas olayotgan jabrlanuvchi qanday holatda yotqiziladi?",o:["Chalqancha","Yon tomonga (barqaror yon holat)","Qorni bilan"],a:1,e:"Yon holat qusuq bilan bo'g'ilib qolish va tilning nafas yo'lini to'sishini oldini oladi."},

/* qo'shimcha lavhalar */
{m:"lavha",q:"«Yo'l bering» belgisi ostida asosiy yo'lning yo'nalishini ko'rsatuvchi lavha turibdi. U nimani bildiradi?",o:["Asosiy yo'l to'g'riga ketadi","Asosiy yo'l chorrahada lavhada ko'rsatilgan tomonga buriladi","Yo'l yopiq"],a:1,e:"Bu lavha bilan chorrahalar imtihonda ko'p uchraydi: qalin chiziq — asosiy yo'l."},
{m:"lavha",q:"Belgi ostidagi «300 m» yozuvli lavha nimani bildiradi?",o:["Belgi 300 m davomida amal qiladi","Belgi ko'rsatgan joygacha 300 m qoldi","Tezlik 300 km"],a:1,e:"«Obyektgacha masofa» lavhasi. «Ta'sir doirasi» lavhasi esa ikki tomonli o'q bilan chiziladi."},
{m:"lavha",q:"Belgi ostida ikki tomonli o'q va «100 m» yozuvli lavha nimani bildiradi?",o:["Obyektgacha masofa","Belgi ta'sir qiladigan masofa","Yo'l kengligi"],a:1,e:"Masalan, «To'xtash taqiqlangan» belgisi ostida bo'lsa — 100 metr davomida to'xtab bo'lmaydi."},
{m:"lavha",q:"Bitta ustunda bir nechta lavha bo'lsa, ular nimaga tegishli?",o:["Faqat yuqoridagi belgiga","Ustundagi belgiga","Keyingi belgiga"],a:1,e:"Lavha o'zi turgan belgini aniqlashtiradi yoki cheklaydi, alohida ma'no bermaydi."},

/* svetofor — ko'rsatkichli */
